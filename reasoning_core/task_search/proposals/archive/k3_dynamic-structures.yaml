    - id: task:generated.wave9.protocol_state_machine_trace.protocol_state_machine_trace:ProtocolStateMachineTrace
      relationship: different
      overlap: Protocol state machine runs event transitions, not state merges across replicas.
    - id: proposal:k3_semantics-preserving-translation:P003
      name: debruijn_scope_translation
