pool:
- name: style_cascade_resolution
  summary: Compute effective styles on nested element trees by matching tag, class, and id selectors,
    comparing specificity then source order, and inheriting unset properties; answer is one element's
    value for a queried property.
- name: tree_reroot_aggregates
  summary: Compute for every node of a weighted tree the sum of distances to all other nodes, via an upward
    subtree pass then a downward reroot pass; vary branching and edge weights; answer is the per-node
    totals.
- name: skip_list_search_trace
  summary: Search a skip list with given node tower heights, moving right while the next key stays under
    target then dropping a level; queries mix present and absent keys; answer is the ordered sequence
    of keys inspected.
- name: spreadsheet_cell_evaluation
  summary: Evaluate grid cells holding constants or formulas with references, rectangular ranges inside
    aggregates, and dependency chains, detecting cycles and propagating errors; answer is the queried
    cell values in order.
- name: piece_table_edit_trace
  summary: Apply insert/delete streams to a piece table over original and append buffers, forcing mid-piece
    splits and cross-piece deletions; answer is the final ordered piece list as (buffer, offset, length)
    triples.
- name: linear_scan_register_allocation
  summary: 'Build live intervals from a def/use listing, then run linear-scan allocation under a fixed
    register count: expire finished intervals, evict the farthest-ending one under pressure; answer each
    variable''s register-or-spill outcome.'
- name: weisfeiler_lehman_color_refinement
  summary: 'Refine vertex colors on a labeled graph round by round: recolor from the sorted multiset of
    neighbor colors until the partition stabilizes; vary symmetry and regular structure; answer per-round
    color histograms and the stable partition.'
- name: ring_membership_key_migration
  summary: Place nodes and keys at given ring positions; joins and leaves move each affected key range
    to its successor, with varied replica and vnode counts; answer the migrated keys per churn event and
    the final ownership map.
