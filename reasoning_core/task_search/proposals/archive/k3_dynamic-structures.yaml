proposals:
- name: ctl_fixpoint_model_checking
  summary: Evaluate nested CTL formulas on small Kripke structures (lassos, trees, diamonds) by least/greatest
    fixpoint iteration for EX/AX, EF/EG and until operators; answers are the sorted satisfying-state set.
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: task:generated.wave9.temporal_logic_monitoring.temporal_logic_monitoring:TemporalLogicMonitoring
      relationship: different
      overlap: Both evaluate temporal logic formulas, but one is LTL over finite traces while this is
        CTL over Kripke structures with branching-time fixpoints.
    - id: task:generated.k3_uncertainty_r1.kripke_knowledge_evaluation.kripke_knowledge_evaluation:KripkeKnowledgeEvaluation
      relationship: different
      overlap: Both interpret formulas on Kripke models, but one uses knowledge modalities and the other
        uses CTL path quantifiers with fixpoint iteration.
    - id: gallery:fixpoint_iteration
      relationship: adjacent
      overlap: Both compute fixpoints of monotone operators, but the proposal uses them for CTL semantics
        on Kripke structures.
    substantive_difference: The new operation is CTL model checking via least/greatest fixpoint iteration
      over Kripke structures, not LTL monitoring or modal knowledge evaluation.
    scores:
      novelty: 4
      sft_value: 4
      feasibility: 5
      clarity: 4
    reason: 'Genuinely new cognitive operation: branching-time fixpoint semantics on Kripke structures
      not covered by existing tasks.'
    votes: 2/3
    dissent:
    - novel
- name: crdt_gossip_state_trace
  summary: Track grow-only and PN counters, last-writer-wins registers, and add-wins sets with tombstones
    across replicas that mutate locally and merge pairwise on a gossip schedule; answer a replica's value
    at a chosen stage or the converged state.
  id: P002
  novelty:
