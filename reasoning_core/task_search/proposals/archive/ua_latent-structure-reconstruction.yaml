pool:
- name: sequential_likelihood_stopping
  summary: Accumulate evidence along ordered observations with history-dependent likelihoods, scheduled
    inspections, and asymmetric stopping boundaries; return the first stopping time and decision, or continuation.
- name: stopping_rule_likelihood_equivalence
  summary: Compare evidence from fixed-sample, sequentially stopped, and censored experiments by constructing
    likelihoods over shared hypotheses; return whether two records have proportional likelihoods.
- name: likelihood_principle_audit
  summary: Compare realized evidence across fixed, censored, and outcome-dependent stopping protocols;
    derive likelihood vectors over hypotheses and identify which records carry proportional evidence.
- name: local_frame_synchronization
  summary: Overlapping observers report vectors in independently permuted, reflected, or rescaled coordinate
    frames; reconcile loop constraints and recover the possible relative frames of a queried pair.
- name: contextual_marginal_extension
  summary: Overlapping variable subsets reveal exact probabilities, forbidden outcomes, or conditional
    ratios; determine joint consistency or recover the attainable probability interval of a queried event.
- name: disablement_provenance_recovery
  summary: An unknown bounded sum-of-products expression generates counts while selected inputs are disabled
    or assigned small weights; combine overlapping responses to recover forced monomials and multiplicities.
- name: strided_alias_reconstruction
  summary: Partially observed writes and readbacks across unknown strided, reversed, and overlapping array
    views constrain shared storage; recover which queried cell pairs must alias or cannot alias.
