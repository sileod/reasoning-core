    constraints into one joint law; answer global compatibility or a tight bound on an unobserved event.
- name: interval_matrix_regularity
  summary: Decide whether every matrix within rational entry bounds is nonsingular; vary independent and
    shared uncertainties, answering robust regularity or the first supplied radius admitting singularity.
- name: overlap_counterterm_subtraction
  summary: Subtract poles from Laurent-valued structures through compatible forests of nested or disjoint
    divergent parts; vary overlaps, contractions and pole orders, returning the surviving finite coefficient.
