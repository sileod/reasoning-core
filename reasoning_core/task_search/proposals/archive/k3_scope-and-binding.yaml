pool:
- name: generalized_quantifier_evaluation
  summary: Evaluate sentences built from proportional, cardinal, exception, and comparative determiners
    (most, fewer than half, no A except B, more A than B) over a finite model; answers are truth values
    or witness counts.
- name: scalar_implicature_evaluation
  summary: Compute literal versus strengthened readings of scalar terms (some, or, numerals, possible)
    in plain, negated, conditional, and universally embedded contexts; answers are a verdict on a candidate
    implicature or the surviving reading.
- name: aspectual_class_entailment
  summary: Classify event predicates as state, activity, accomplishment, or achievement using in/for-adverbial,
    progressive-entailment, and stop-test diagnostics, then verdict the licensed inferences; answers are
    the class plus those verdicts.
- name: plural_predication_verdicts
  summary: Judge distributive, collective, cumulative and reciprocal (strong/intermediate) readings of
    plural sentences over atom, group and relation tables; answers are the true readings.
