- name: invented_numeral_evaluation
  summary: Evaluate and generate invented numeral systems built from stipulated additive, multiplicative,
    and subtractive morpheme rules; answers give a string's value, the canonical string for a value, or
    a well-formedness verdict.
  id: P001
  novelty:
