      relationship: adjacent
      overlap: Both involve invented languages with novel morphemes, but one composes words via compounding/derivation
        and the other evaluates numeral strings using arithmetic rules.
    - id: proposal:k3_synthetic-grammars:P005
      relationship: adjacent
      overlap: Both evaluate structures using stated rewriting/attribute rules, but one uses attribute
        grammars on parse trees and the other on numeral systems.
    - id: proposal:k3_parsing-and-agreement:P001
      relationship: adjacent
      overlap: Both evaluate invented operations on finite carriers, but one uses Cayley tables and the
        other numeral morphemes.
    substantive_difference: The cognitive operation is specifically to interpret a positional/arithmetic
      numeral system with additive/multiplicative/subtractive rules, which is distinct from the nearest
      neighbors that focus on lexical composition or attribute evaluation.
