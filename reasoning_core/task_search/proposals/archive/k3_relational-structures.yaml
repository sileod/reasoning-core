- name: kinship_relation_resolution
  summary: 'Resolve kinship queries on pedigree DAGs of parent links: locate the lowest common ancestors
    of two members, measure the up/down path lengths, and derive the cousin-degree/removal designation;
    answer is that designation.'
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:k3_representation-transfer:P004
      relationship: adjacent
      overlap: Both navigate tree structures and resolve ancestor/descendant relationships, but C004 adds
        the cousin-degree/removal computation over lowest common ancestors, a distinct pattern not in
        P004.
    - id: proposal:k3_verification-repair:P008
      relationship: adjacent
      overlap: Both work on DAGs and compute path-related quantities, but betweenness counts all shortest
        paths while kinship focuses on ancestor chains and LCA depths.
    - id: task:generated.wave9.transitive_reduction.transitive_reduction:TransitiveReduction
      relationship: adjacent
      overlap: Both analyze DAG edge structure, but transitive reduction removes redundant edges while
        kinship derives genealogical relations from ancestor paths.
    substantive_difference: "Kinship resolution computes LCA depth and up/down path lengths to derive\
      \ cousin degree/removal\u2014a domain-specific operation not present in general tree navigation\
      \ or DAG algorithms."
    scores:
