pool:
- name: plural_predication_covers
  summary: Interpret plural noun phrases over finite atom sums using collective, distributive and cumulative
    predicate lifts and stated covers; return the satisfying groups or the sentence's truth value.
- name: intensional_counterpart_evaluation
  summary: Interpret de re and de dicto predication across finite worlds with counterpart links, rigid
    names, and world-dependent descriptions; return truth values or the individuals satisfying a report.
- name: branching_quantifier_dependence
  summary: Interpret quantified clauses whose witnesses may depend on only specified universal choices;
    vary shared witnesses, independent choices, and nested dependencies; return whether a legal witness
    assignment exists.
- name: exceptive_quantifier_interpretation
  summary: Interpret exceptives with universal, negative, and bounded quantifiers, distinguishing domain
    subtraction from exhaustive exception claims; return truth or undefinedness under stated existence
    conditions.
- name: counterfactual_sphere_evaluation
  summary: Evaluate counterfactual clauses using world-relative similarity spheres, tied closest worlds,
    and explicit impossible-antecedent rules; compose nested conditionals and negation; return truth values.
