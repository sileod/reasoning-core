pool:
- name: coalition_excess_balancing
  summary: Allocate a fixed payoff by lexicographically minimizing descending coalition dissatisfaction
    across overlapping claims, individual floors and coalition values; answer the allocation or successive
    excess thresholds.
- name: ascertainment_conditioned_likelihood
  summary: Compare hypotheses after threshold screening, outcome-dependent reporting, or case enrichment
    using stated selection probabilities; return the likelihood ratio conditional on inclusion.
- name: relational_team_satisfaction
  summary: Evaluate dependence, inclusion, and exclusion claims over collections of assignments with conjunction
    and split disjunction; answer whether one globally coherent partition satisfies the nested claims.
- name: sequential_likelihood_stopping
  summary: Accumulate evidence along ordered observations with history-dependent likelihoods, scheduled
    inspections, and asymmetric stopping boundaries; return the first stopping time and decision, or continuation.
- name: quantifier_dependency_uniformity
  summary: Decide whether existential choices can satisfy a finite relation when each choice observes
    only specified universal variables; vary shared observations and forbidden dependencies; return feasibility.
- name: compartment_spill_propagation
  summary: Redistribute liquid through partitioned vessels under successive tilts and pours, accounting
    for sill heights, trapped pools, and external overflow; return retained volumes or the next spill
    boundary.
- name: mechanical_backlash_tracking
  summary: Propagate motion through couplings where reversals consume slack before moving downstream parts,
    varying asymmetric gaps and cascades; return a queried part's position or remaining slack.
- name: conserved_liquid_tilting
  summary: Track conserved liquid through upright and tilted rectangular containers, immersed blocks,
    transfers, and rim spill; return the retained volume or fill depth after the specified changes.
- name: referential_action_propagation
  summary: Propagate deletes and key updates through chained or cyclic foreign keys with cascade, set-null,
    restrict, and deferred checks; report surviving row values or the constraint that aborts the transaction.
- name: wash_sale_basis_relay
  summary: Carry disallowed losses through partial replacement lots and repeated resales under stated
    wash-sale rules; vary overlapping purchase windows and lot selection; answer a target lot's basis
    or recognized loss.
- name: convertible_security_conversion
  summary: Resolve share entitlements when conversion caps, discounts and option-pool top-ups use interacting
    capitalization definitions; vary simultaneous instruments and round order; answer a holder's final
    ownership.
- name: effect_resumption_state
  summary: Trace captured computations through deep or shallow effect handlers, discarded or repeated
    resumptions, and handler-local state; answer the returned value and surviving state.
- name: complement_preserving_view_edits
  summary: Propagate edits backward through composed views while preserving hidden source information;
    vary regrouping, insertion defaults and normalization rules; answer the repaired source fragment.
- name: overprint_plate_composition
