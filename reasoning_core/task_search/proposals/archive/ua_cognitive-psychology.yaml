    nearest_neighbors:
    - id: proposal:k3_paraphrase-equivalence:P003
      relationship: adjacent
      overlap: Both compare semantic equivalence, but questions and answer partitions are a different
        object than focus alternatives.
    - id: task:generated.wave12.information_seeking.information_seeking:InformationSeeking
      relationship: adjacent
      overlap: Information-seeking picks queries by partition but does not assess equivalence between
        questions.
    - id: proposal:ua_state-tracking:P009
      relationship: adjacent
      overlap: Likelihood partitions are statistical, not about question semantics.
    substantive_difference: The operation of computing answer partitions of questions and comparing them
      is not in the known neighbors; they are about focus alternatives or query selection, not question-answer
      semantics.
    scores:
      novelty: 5
      sft_value: 4
      feasibility: 5
      clarity: 4
    reason: Novel because it introduces question answer-set equivalence, a distinct semantic operation.
    votes: 2/2
    dissent: []
