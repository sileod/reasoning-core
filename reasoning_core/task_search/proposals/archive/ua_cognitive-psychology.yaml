proposals:
- name: loss_coverage_equivalence
  summary: Compare coverage clauses with per-item and per-occurrence deductibles, aggregate caps, exclusions
    and limit reinstatement; decide whether reordered or regrouped descriptions yield identical payouts
    across loss histories.
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: task:generated.wave9.ledger_reconciliation.ledger_reconciliation:LedgerReconciliation
      relationship: adjacent
      overlap: Both work with financial transactions but reconciliation tracks balances, not coverage
        equivalence.
    - id: proposal:ua_state-tracking:P007
      relationship: adjacent
      overlap: Mean preserving spread is statistical, not about payout rules.
    - id: proposal:ua_uncertainty:P007
      relationship: adjacent
      overlap: Claimant redistribution is a different problem.
    substantive_difference: Comparing insurance coverage clauses for identical payouts across loss histories
      is a unique operation not in any neighbor.
    scores:
      novelty: 5
      sft_value: 4
      feasibility: 4
      clarity: 4
    reason: 'Novel: coverage clause equivalence under loss scenarios is distinct from ledger or distribution
      tasks.'
    votes: 2/2
    dissent: []
- name: question_partition_equivalence
