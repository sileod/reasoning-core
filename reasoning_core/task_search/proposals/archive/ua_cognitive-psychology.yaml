pool:
- name: evidence_reuse_equivalence
  summary: Compare sentences combining independent support, alternative derivations and repeated use of
    one source; distinguish evidence identity from multiplicity and decide whether their support expressions
    coincide.
- name: cue_competition_credit_assignment
  summary: Redistribute prediction error among jointly presented cues under stated learning rates; vary
    compound training, blocking, extinction, and outcome reversals; answer learned cue strengths or probe
    predictions.
- name: attentional_blink_gating
  summary: Track target admission through an attention gate with stated consolidation and recovery rules;
    vary distractor gaps, adjacent targets, and prolonged stimuli; answer admitted targets or the gate
    state.
- name: perceptual_rivalry_adaptation
  summary: Track competing percepts under stated mutual inhibition, dominance adaptation, and recovery
    rules; vary stimulus pulses, interruptions, and asymmetric strengths; answer the dominant percept
    or switch count.
- name: leaky_evidence_commitment
  summary: Accumulate signed evidence with stated leakage, starting bias, and absorbing decision bounds;
    vary interruptions, changing bounds, and opposing evidence bursts; answer the committed choice and
    stopping time.
