- name: hysteresis_reversal_memory
  summary: 'Reduce reversal histories under return-point memory: close nested excursions, erase enclosed
    extrema, and saturate at stated bounds across alternating drives; return surviving extrema or the
    active branch.'
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:k3_language-implementation:P008
      relationship: adjacent
      overlap: Both involve rollback/recovery with memory of past states, but ARIES crash recovery is
        database-specific, while hysteresis is about material memory in driven systems.
    - id: task:generated.k3_uncertainty_r1.iterated_dominance_elimination.iterated_dominance_elimination:IteratedDominanceElimination
      relationship: adjacent
      overlap: Both reduce sets by iterated elimination under constraints, but iterated dominance is game-theoretic
        strategy removal, not physical memory.
    - id: proposal:k3_state-tracking:P007
      relationship: adjacent
      overlap: Both track state with counters through streams, but Misra-Gries summaries are approximate
        frequency estimation, not hysteresis with return-point memory.
    substantive_difference: Implements a specific physical memory model (return-point analysis) that,
      to my knowledge, is not present in any catalog task; the state reduction and branch selection are
      concretely defined.
    scores:
      novelty: 5
