pool:
- name: replacement_lot_basis_transfer
  summary: Apply supplied loss-deferral rules across partial sales, replacement windows, stock splits,
    and repeated resales; track transferred losses through replacement lots and return recognized loss
    or adjusted basis.
- name: oriented_boundary_repair
  summary: Update the signed boundary of an oriented cell assembly after cell insertion, deletion, or
    reversal; combine shared-face contributions and return only faces whose net boundary coefficient changes.
- name: piecewise_envelope_repair
  summary: Repair upper or lower envelopes after inserting, deleting, or editing domain-limited affine
    pieces; account for intersections, ties, and gaps, returning changed winner intervals and their new
    expressions.
- name: adaptive_partition_rebalance
  summary: Repair rectangular subdivision meshes after local refinement or requested coarsening; enforce
    stated neighbor depth bounds with minimal additional splits, returning changed leaves or a blocked
    coarsening.
- name: graph_local_complementation
  summary: Apply sequences of neighborhood complementation, edge pivots, and vertex deletion to labeled
    simple graphs; track changing neighborhoods and return the surviving edges or a queried adjacency.
- name: term_residual_tracking
  summary: Track marked node occurrences through supplied term rewrites that duplicate, erase, or relocate
    substituted subtrees; return all surviving descendants of a mark or the origins of a queried occurrence.
- name: divided_difference_expansion
  summary: Apply iterated polynomial operators that subtract a variable-swapped copy and divide by the
    variable difference; range over repeated indices, products, and sparse sums, returning the resulting
    coefficients.
- name: relational_lens_putback
  summary: Propagate view insertions, deletions, and replacements backward through selection, projection,
    and join lenses with declared keys and deletion policies; return the changed source rows.
- name: graph_rewrite_gluing_obstructions
  summary: Apply node-and-edge replacement rules through noninjective graph matches; detect dangling edges
    and forbidden identifications, returning an obstruction witness or a queried surviving connection.
- name: compositional_lens_putback
  summary: Push view replacements backward through composed, paired, and branched lenses with retained
    complements; preserve hidden source fields and return the updated source or the first undefined update.
- name: simplicial_operator_normalization
  summary: Normalize composites of dimension-indexed face and degeneracy maps using index-shift and cancellation
    identities; return the canonical operator word or its omitted and repeated vertex indices.
