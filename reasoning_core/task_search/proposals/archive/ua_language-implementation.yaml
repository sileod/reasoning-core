pool:
- name: observed_remove_reconciliation
  summary: Reconcile replicated sets whose additions carry unique tags and removals erase only observed
    tags; vary concurrent re-additions, delayed exchanges, and repeated merges; return surviving members.
- name: delimited_continuation_reentry
  summary: Evaluate capture and reinstatement of delimited continuations across nested prompts, discarded
    continuations, and repeated resumptions; report the resulting value or ordered observable effects.
- name: finite_conditional_independence
  summary: Test independence in exact finite distributions after conditioning, marginalizing hidden variables,
    or coarsening outcomes; include mixture-induced dependence and cancellation; return which claims hold.
- name: sequential_likelihood_stopping
  summary: Accumulate evidence along ordered observations with history-dependent likelihoods, scheduled
    inspections, and asymmetric stopping boundaries; return the first stopping time and decision, or continuation.
- name: stopping_rule_likelihood_equivalence
  summary: Compare evidence from fixed-sample, sequentially stopped, and censored experiments by constructing
    likelihoods over shared hypotheses; return whether two records have proportional likelihoods.
- name: occluded_motion_extrapolation
  summary: Extrapolate hidden motion from timed sightings under stated constant-velocity and wall-reflection
    rules, varying chambers and occlusion intervals; return reappearance position or direction.
- name: compartment_spill_propagation
  summary: Redistribute liquid through partitioned vessels under successive tilts and pours, accounting
    for sill heights, trapped pools, and external overflow; return retained volumes or the next spill
    boundary.
- name: mechanical_backlash_tracking
  summary: Propagate motion through couplings where reversals consume slack before moving downstream parts,
    varying asymmetric gaps and cascades; return a queried part's position or remaining slack.
- name: quantifier_certificate_audit
  summary: Audit quantified deduction traces with nested assumptions, witness introduction, generalization,
    and discharge; locate the first scope or freshness violation or identify an admissible replacement
    witness.
- name: quantifier_dependency_uniformity
  summary: Decide whether existential choices can satisfy a finite relation when each choice observes
    only specified universal variables; vary shared observations and forbidden dependencies; return feasibility.
- name: observer_nested_belief_updates
  summary: Update nested beliefs under private moves, identity disguises, witnessed observations, and
    selective corrections; return an observer's attributed object identity or expected search location.
- name: layered_occlusion_ownership
  summary: Resolve line-of-sight ownership through layered silhouettes with holes, partial overlaps, and
    displaced viewpoints; return the visible surface at queried locations or its exposed area.
