pool:
- name: scalar_implicature_evaluation
  summary: Compute literal versus strengthened readings of scalar terms (some, or, numerals, possible)
    in plain, negated, conditional, and universally embedded contexts; answers are a verdict on a candidate
    implicature or the surviving reading.
- name: plural_predication_verdicts
  summary: Judge distributive, collective, cumulative and reciprocal (strong/intermediate) readings of
    plural sentences over atom, group and relation tables; answers are the true readings.
- name: regex_residual_derivatives
  summary: Compute Brzozowski derivatives of regular expressions along a given prefix, simplifying to
    canonical form with stated identities; answer the residual expression, the nullability sequence, or
    a tail-acceptance verdict.
- name: markov_algorithm_trace
  summary: 'Execute Markov algorithms: ordered string-rewrite rules replace the leftmost match, first
    applicable rule wins, until a halting rule fires; modes request the final string, the step count,
    or whether a queried rule ever fires.'
- name: counter_machine_trace
  summary: Trace counter-machine programs where registers increment, decrement, and jump-if-zero through
    labeled lines; modes ask for a named register's value at halt, the total step count, or one register's
    value trace across the run.
- name: tree_transducer_run
  summary: 'Run top-down tree transducers: states consume input nodes and emit output templates that recurse
    into children under reassigned states; answer the serialized output tree or the input position where
    no rule applies.'
