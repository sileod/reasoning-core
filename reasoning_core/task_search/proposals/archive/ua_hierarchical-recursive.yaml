pool:
- name: adaptive_partition_rebalance
  summary: Repair rectangular subdivision meshes after local refinement or requested coarsening; enforce
    stated neighbor depth bounds with minimal additional splits, returning changed leaves or a blocked
    coarsening.
- name: compositional_lens_putback
  summary: Push view replacements backward through composed, paired, and branched lenses with retained
    complements; preserve hidden source fields and return the updated source or the first undefined update.
- name: graph_rewrite_gluing
  summary: Apply interface-preserving graph rewrites at supplied matches, checking dangling edges and
    forbidden vertex identifications before each step; return the resulting graph or the blocking elements.
- name: tree_pair_group_product
  summary: Multiply elements represented by paired binary trees by refining shared middle trees, carrying
    expansions to outer trees, and cancelling matching carets; recover the reduced product or decide identity.
- name: nested_membrane_evolution
  summary: Evolve nested compartments through simultaneous token consumption, inward or outward transport,
    division, and deferred dissolution under stated rule priorities; determine compartment contents after
    successive rounds.
- name: fault_tree_minimal_cutsets
  summary: Derive minimal leaf-failure sets for nested AND, OR, and threshold fault gates, sharing repeated
    leaf identities and removing redundant supersets; identify all minimal cutsets or test a proposed
    cutset.
- name: phylogenetic_event_reconciliation
  summary: Reconcile rooted gene trees with species trees using leaf species labels; vary repeated species,
    missing lineages, and branching shapes; report implied duplication and loss counts under stated event
    rules.
- name: recursive_partition_interface
  summary: Measure interfaces between labeled regions in recursively subdivided rectangles; vary unequal
    refinement, alternating split axes, holes, and repeated labels; answer shared boundary length for
    a requested label pair.
- name: hereditary_base_descent
  summary: Execute base changes and predecessor steps on hereditary numerals whose exponents are recursively
    encoded; vary sparse digits, nested exponents, and borrowing chains; answer the resulting hereditary
    numeral.
- name: hierarchical_conservative_rounding
  summary: Round fractional leaf quantities while preserving prescribed totals throughout a grouping hierarchy;
    vary signed values, fixed leaves, and competing rounding costs; answer the least-cost consistent leaf
    allocation.
