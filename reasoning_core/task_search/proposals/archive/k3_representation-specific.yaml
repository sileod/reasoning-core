pool:
- name: string_rewrite_normalization
  summary: 'Apply an ordered string-rewrite system: repeatedly fire the earliest rule whose pattern occurs,
    at its leftmost site, until nothing matches, over erasing, swapping and overlapping rule families;
    answer the irreducible word.'
- name: unordered_tree_canonization
  summary: Encode rooted and free trees bottom-up into canonical strings, then group a batch of trees
    by isomorphism or pick a class representative; vary labeling, child ordering, and symmetric shapes.
- name: color_refinement_partitioning
  summary: Recolor vertex-colored graphs round by round, hashing each vertex's multiset of neighbor colors
    until the partition stabilizes, across discrete, regular, and near-isomorphic instances; answer the
    stable color classes.
- name: core_number_peeling
  summary: Peel a graph by repeatedly deleting a smallest-degree vertex (ties by smallest id), across
    cliques, trees, layered and random graphs, recording degree at removal; answer the per-vertex core
    numbers.
- name: datalog_fixed_point_derivation
  summary: 'Evaluate negation-free Datalog bottom-up: apply linear and nonlinear recursive rules (transitivity,
    multi-join, filtered derivations) over small fact bases until saturation; answer the sorted set of
    derived facts.'
