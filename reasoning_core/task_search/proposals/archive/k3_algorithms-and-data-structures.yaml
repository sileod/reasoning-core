    nearest_neighbors:
    - id: proposal:k3_cognitive-psychology:P004
      name: degree_construction_equivalence
      relationship: adjacent
      overlap: Both test paraphrase equivalence by translating to formal constraints (order/threshold
        vs. temporal interval), but operate on different semantic domains (degree vs. time).
    - id: proposal:k3_paraphrase-equivalence:P003
      name: focus_particle_equivalence
      relationship: adjacent
      overlap: Both evaluate truth-conditional equivalence of paraphrases, but focus particles involve
        alternatives, while temporal connectives involve ordering and aspect.
    - id: task:generated.wave9.temporal_logic_monitoring.temporal_logic_monitoring:TemporalLogicMonitoring
      relationship: different
      overlap: Temporal logic monitoring evaluates LTL over traces, while this task coerces natural-language
