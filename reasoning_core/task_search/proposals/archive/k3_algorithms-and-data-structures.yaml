    nearest_neighbors:
    - id: proposal:k3_synthetic-grammars:P007
      relationship: adjacent
      overlap: Both simulate rewriting systems on words, but C007's operation is specific to circulating
        seeds around a board with capture rules, a different simulation.
    - id: task:generated.wave9.event_queue_simulation.event_queue_simulation:EventQueueSimulation
      relationship: adjacent
      overlap: Both process state changes in discrete steps, but C007 has unique sowing and capturing
        mechanics not present in generic event queues.
    - id: proposal:k3_synthetic-grammars:P002
      relationship: adjacent
      overlap: Both involve iterative rewriting that modifies a sequence, but head splicing uses fixed-site
        recombination, not seed circulation.
    substantive_difference: The operation of simulating a mancala-style game with directional sowing and
      capture-on-landing is a distinct algorithmic procedure not represented among the listed neighbors.
