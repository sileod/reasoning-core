- name: temporal_connective_equivalence
  summary: Clauses linked by until, since, while, before/after and no-sooner under negation and durative
    or punctual aspect; coerce each to event orderings and intervals; answer whether restructured paraphrases
    preserve the temporal claim.
  id: P002
  novelty:
