pool:
- name: concurrent_edit_rebasing
  summary: Rebase concurrent insertions, deletions, and replacements through intervening text edits, preserving
    intended targets under overlap and stated tie rules; return the transformed edit or reconciled text.
- name: evidence_mass_fusion
  summary: Combine evidence masses on overlapping subsets through discounting, conjunctive fusion, and
    stated conflict redistribution; return a queried fused mass, belief, or plausibility.
- name: forest_renormalization
  summary: Subtract Laurent-series divergences across nested, disjoint, and overlapping substructures
    using admissible subtraction forests and pole extraction; return a counterterm or finite renormalized
    coefficient.
- name: nuisance_contrast_identifiability
  summary: From linear readings with shared offsets, drift terms, or calibration nuisances, determine
    whether a target contrast is identifiable and recover its value by eliminating nuisance directions.
- name: marginal_extension_consistency
  summary: Combine probability tables on overlapping variable subsets into constraints on one joint distribution;
    determine compatibility or the attainable range of an unreported event probability.
- name: projective_correspondence_completion
  summary: Use point correspondences across projectively related coordinate lines to recover missing coordinates
    or reject inconsistent observations, including finite points and points at infinity.
- name: qualitative_perturbation_dominance
  summary: Compare rational expressions under stated hierarchies of vanishing perturbations, accounting
    for canceled leading terms; return eventual order, sign, or the first surviving asymptotic contribution.
- name: counterfactual_seed_coupling
  summary: Filter finite latent seeds using factual observations, then retain those same seeds under changed
    structural assignments; recover counterfactual outcomes, probabilities, or bounds when seeds remain
    ambiguous.
- name: strategy_realization_equivalence
  summary: Translate mixtures of complete plans and local random choices into decision-history weights,
    respecting shared information sets and unreachable branches; decide equivalence or recover an equivalent
    policy.
