pool:
- name: sequential_likelihood_stopping
  summary: Accumulate evidence along ordered observations with history-dependent likelihoods, scheduled
    inspections, and asymmetric stopping boundaries; return the first stopping time and decision, or continuation.
- name: stopping_rule_likelihood_equivalence
  summary: Compare evidence from fixed-sample, sequentially stopped, and censored experiments by constructing
    likelihoods over shared hypotheses; return whether two records have proportional likelihoods.
- name: coalition_excess_balancing
  summary: Allocate a fixed payoff by lexicographically minimizing descending coalition dissatisfaction
    across overlapping claims, individual floors and coalition values; answer the allocation or successive
    excess thresholds.
- name: ascertainment_conditioned_likelihood
  summary: Compare hypotheses after threshold screening, outcome-dependent reporting, or case enrichment
    using stated selection probabilities; return the likelihood ratio conditional on inclusion.
- name: relational_team_satisfaction
  summary: Evaluate dependence, inclusion, and exclusion claims over collections of assignments with conjunction
    and split disjunction; answer whether one globally coherent partition satisfies the nested claims.
- name: polygon_seam_surface_type
  summary: Infer the global surface formed by polygon edge identifications with reversed or preserved
    directions and unpaired edges; answer orientability, boundary count, and genus or crosscap count.
- name: polynomial_radical_consequence
  summary: Combine monomial, binomial, and coupled polynomial equations over complex variables; decide
    whether a queried polynomial vanishes on every common solution, distinguishing radical from ideal
    membership.
- name: boundary_degree_inference
  summary: Combine oriented boundary pieces and nonzero piecewise-linear vector values in two or three
    dimensions; infer the signed interior zero count forced by the boundary and whether a zero must exist.
- name: projection_join_spuriousness
  summary: Combine attribute dependencies with overlapping relational projections; determine whether recombining
    the projections can introduce records absent from an original relation satisfying those dependencies.
- name: simplicial_link_manifold_audit
  summary: Combine triangle or tetrahedron incidences whose face counts may appear locally valid; use
    vertex and edge neighborhoods to decide whether the whole complex is a manifold, with or without boundary.
