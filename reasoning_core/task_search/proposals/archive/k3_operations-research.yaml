pool:
- name: window_frame_cell_evaluation
  summary: Evaluate row-valued queries over partitions and ordered keys using lag/lead, rank, and running
    or range frames with ties and null policy; report values at queried cells or a row's frame membership.
- name: sequent_proof_search
  summary: Search for a propositional sequent-calculus derivation, applying invertible rules freely and
    branching on disjunctive ones; answer derivability, a countermodel valuation from an open leaf, or
    the leaf count of the finished tree.
- name: transportation_potential_pricing
  summary: 'Work a supply-demand shipping plan: derive row and column potentials from the occupied cells,
    price the empty ones, then shift flow around the best cell''s loop; answers are reduced costs, the
    loop route, or cost after stated pivots.'
- name: reduced_matrix_tour_branching
  summary: 'Branch-and-bound small tours on reduced matrices: subtract row/column minima, rank zeros by
    penalty, branch on the top zero, re-reduce and prune; answers are optimal tour value, branch order,
    or best live lower bound.'
- name: binary_weight_incidence_reordering
  summary: Treat incidence matrix rows then columns as binary numbers, sort by decreasing weight, and
    iterate until stable, revealing machine cells; answers are final row/column permutations, block count,
    or exceptional-bit count.
- name: externality_priced_bundle_awards
  summary: Enumerate disjoint bundle awards over small bid sets, pick the welfare-maximizing one, and
    set each winner's payment to the welfare lost by deleting its bid; answers are winners, payments,
    or the excluded-bidder externality.
- name: reorder_point_lag_pipeline_replay
  summary: 'Replay demands against a reorder point with lead-time pipeline: fire orders as inventory position
    crosses, receive after the lag, and carry backlogs; answers are order dates/sizes, stockout periods,
    or ending service level.'
- name: integer_branch_and_bound_trace
  summary: 'Explore small integer programs under a stated branching rule: bound nodes by fractional relaxation,
    prune by bound or infeasibility, update the incumbent; answers are visit order, first pruned node,
    or final incumbent value.'
