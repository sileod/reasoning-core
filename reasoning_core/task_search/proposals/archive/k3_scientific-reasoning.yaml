pool:
- name: finite_structure_satisfaction
  summary: 'Evaluate first-order formulas over finite structures given as a domain plus tables: nested
    quantifiers, equality, Boolean connectives; answer a sentence''s truth, tuples satisfying an open
    formula, or an existential witness.'
- name: sequent_proof_search
  summary: Search for a propositional sequent-calculus derivation, applying invertible rules freely and
    branching on disjunctive ones; answer derivability, a countermodel valuation from an open leaf, or
    the leaf count of the finished tree.
- name: vector_clock_causality
  summary: Advance vector clocks along per-process event chains joined by message edges; adjudicate a
    queried pair as ordered or concurrent, list the events concurrent with a cut, or find the earliest
    common descendant.
- name: factor_elimination_marginals
  summary: 'Compute query marginals in small belief networks: following a stated elimination order, multiply
    factor tables and sum out variables; answers are exact rational marginals, an intermediate factor,
    or the normalizer.'
- name: vertex_elimination_fill_accounting
  summary: Eliminate vertices in turn under a stated min-degree or min-fill rule, adding fill edges that
    complete each removed vertex's neighborhood; answer the fill added per step, the largest clique formed,
    or the final order.
- name: bayes_factor_enumeration
  summary: 'Exact inference in small discrete Bayesian networks: multiply CPT factors, sum out hidden
    variables, then renormalize; answer a queried posterior probability or the full conditional table
    under given evidence.'
- name: version_space_boundary_tracking
  summary: Track the S and G boundary sets of a version space over feature conjunctions as labeled examples
    stream in, generalizing or specializing each; answer surviving hypotheses or a held-out label.
- name: rsk_insertion_tableaux
  summary: Schensted insertion of permutations or multiset words into a growing tableau via bumping, tracking
    the recording tableau; answers are final rows, common shape, bump counts, or which step filled a cell.
- name: ranked_ballot_elimination_transfer
  summary: 'Instant-runoff counting over ranked ballots: retally first choices, drop the lowest candidate,
    transfer those ballots downward as exhausted ones leave; answers are round tallies, the round a named
    candidate falls, or the winner.'
- name: cellular_automaton_step_trace
  summary: Evolve 1D rule-table and totalistic automata and 2D outer-totalistic Life-like grids under
    periodic or absorbing borders; answer the row or grid after k steps, the live-cell count, or the first
    repeated configuration.
- name: sandpile_stabilization_trace
  summary: Topple overloaded vertices on graph and grid sandpiles with a sink boundary, firing any legal
    unstables in stated order; answers are the stable configuration, the per-vertex odometer, or whether
    one added grain sets off an avalanche.
- name: subtraction_game_grundy_tables
  summary: Build P/N and mex-computed Grundy tables for take-away games with finite subtraction sets and
    heap-splitting variants; answers are the value at a heap size, the table over an interval, or the
    detected eventual period.
- name: lambda_term_reduction_trace
  summary: Reduce untyped lambda terms, including Church numeral and pair encodings, under a stated strategy
    (normal order, applicative, call-by-value) with alpha-renaming; answers are the normal form, reduction
    step count, or the k-th reduct.
- name: array_language_evaluation
  summary: 'Evaluate expressions in a rank-polymorphic array language over integer vectors and matrices:
    maps, folds and scans, sliding windows, inner/outer products, reshapes and gathers; answers are the
    result array, its shape, or a queried cell.'
- name: sequential_posterior_grid
  summary: Multiply a prior over hypotheses by each datum's likelihood and renormalize over varied evidence
    streams; report the ranking after k data, posterior odds, or the first leader-flip datum.
- name: analogy_transform_transfer
  summary: Induce the short composition of listed transforms (rotate, reverse, recolor, transpose) taking
    a source object to its image, then apply it to fresh inputs; answers are the transformed object or
    the transform a faulty candidate drops.
