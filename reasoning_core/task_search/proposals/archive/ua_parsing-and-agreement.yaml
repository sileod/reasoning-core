pool:
- name: addressed_tree_adjunction
  summary: Execute tree grammars with substitution leaves and auxiliary trees whose foot receives the
    displaced subtree; vary nested and repeated adjunction at addressed nodes, returning the final frontier
    or queried subtree.
- name: gapping_parallelism_recovery
  summary: Recover omitted predicates in coordinated clauses using supplied remnant correspondences; vary
    contrastive arguments, shared adjuncts and nested coordination; answers give the reconstructed clause.
- name: focus_alternative_projection
  summary: Compute alternatives induced by focused constituents under supplied composition rules across
    predicates, modifiers, conjunction, and nested focus operators; return the resulting alternative denotations.
- name: respectively_dependency_expansion
  summary: Expand respectively constructions by pairing coordinated arguments and modifiers at their licensed
    syntactic scopes; handle nested lists and shared constituents, returning the resulting atomic predications.
- name: paycheck_anaphora_instantiation
  summary: Interpret functional anaphors by abstracting a relation from an antecedent description and
    reapplying it to a new argument; vary possessors, nested relations, and scope, returning the selected
    referents.
