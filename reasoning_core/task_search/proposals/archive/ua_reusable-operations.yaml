    nearest_neighbors:
    - id: task:generated.k3_relational_structures_r1.symbolic_differentiation.symbolic_differentiation:SymbolicDifferentiation
      relationship: different
      overlap: Both manipulate symbolic mathematical expressions, but differentiation uses rules on function
        trees while pullback uses Jacobian substitution and wedge products; distinct operations.
    - id: proposal:ua_compositional-generalization:P012
      relationship: adjacent
      overlap: Both work with antisymmetric algebra, but iterated integrals shuffle vs. form pullback
        differ.
    - id: task:generated.wave9.coordinate_frame_composition.coordinate_frame_composition:CoordinateFrameComposition
      relationship: adjacent
      overlap: Both compose transformations, but one is discrete frames, the other continuous differential
        forms.
    substantive_difference: Pullback of differential forms is a unique algebraic-geometric computation
      not in the catalog.
    scores:
