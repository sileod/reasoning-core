      relationship: different
      overlap: Concerns partial order comparison of games, not mixture equivalence under information sets.
    - id: task:math_scratch:MathScratchEntailment
      relationship: adjacent
      overlap: Decides equivalence of expressions, but through symbolic rewriting, not probabilistic decision
        histories.
    - id: proposal:k3_paraphrase-equivalence:P003
      relationship: adjacent
      overlap: Both decide semantic equivalence, but one in language and the other in strategy space.
    substantive_difference: Combines probability weighting, information sets, and unreachable branches
      into a single equivalence test, no existing neighbor covers this.
    scores:
