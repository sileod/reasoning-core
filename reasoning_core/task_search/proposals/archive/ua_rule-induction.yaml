- name: mechanical_backlash_induction
  summary: Infer slack, directional dead zones and reset behavior from actuator traces; execute new reversals,
    partial slack takeups and coupled movements to determine final readouts.
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:k3_language-implementation:P008
      relationship: different
      overlap: Different domain; C008 is mechanical backlash, neighbor is database crash recovery.
    - id: proposal:ua_systematic-generalization:P007
      relationship: adjacent
      overlap: Both involve inferring a hidden state update mechanism from examples, but ordinal descent
        is numeric, backlash is spatial.
    - id: proposal:k3_latent-structure-reconstruction:P009
      relationship: adjacent
      overlap: Both infer a hidden transition system from traces, but one is a Mealy machine, the other
        a mechanical backlash model.
    substantive_difference: The mechanical backlash model with slack, dead zones, and takeup is a specifically
      engineered latent state induction task, unlike generic state machine inference. The combination
      of directional asymmetry and hysteresis is unique.
    scores:
      novelty: 4
      sft_value: 4
      feasibility: 4
      clarity: 4
    reason: No existing task covers mechanical backlash inference with directional dead zones and takeup;
      it's a distinct operation.
    votes: 2/3
    dissent:
    - novel
- name: strategy_realization_equivalence
  summary: Translate mixtures of complete plans and local random choices into decision-history weights,
    respecting shared information sets and unreachable branches; decide equivalence or recover an equivalent
    policy.
