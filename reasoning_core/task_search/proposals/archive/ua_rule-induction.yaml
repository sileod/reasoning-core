pool:
- name: relational_selector_induction
  summary: Infer object-selection rules from labeled scenes, varying existential, universal, counting
    and nested relational conditions; identify the selected objects in a new scene.
- name: action_effect_induction
  summary: Infer action preconditions and conditional effects from before-and-after demonstrations, including
    toggles, consumption and enabling; determine the state after a new action sequence.
- name: sequential_likelihood_stopping
  summary: Accumulate evidence along ordered observations with history-dependent likelihoods, scheduled
    inspections, and asymmetric stopping boundaries; return the first stopping time and decision, or continuation.
- name: stopping_rule_likelihood_equivalence
  summary: Compare evidence from fixed-sample, sequentially stopped, and censored experiments by constructing
    likelihoods over shared hypotheses; return whether two records have proportional likelihoods.
- name: ascertainment_conditioned_likelihood
  summary: Compare hypotheses after threshold screening, outcome-dependent reporting, or case enrichment
    using stated selection probabilities; return the likelihood ratio conditional on inclusion.
- name: stamp_compositing_induction
  summary: Infer registration offsets, transparent inks and knockout behavior from layered stamp demonstrations;
    apply unseen placements and layer orders to determine visible marks at queried positions.
- name: strided_storage_aliasing
  summary: Execute assignments through overlapping, reversed, broadcast, and strided views under snapshot
    or sequential read semantics; return selected cells or identify the first write that changes a later
    read.
- name: pooled_distinctness_reconstruction
  summary: Overlapping pools report exact, bounded, or saturated counts of distinct hidden types rather
    than item counts; reconcile one global partition and recover forced same-type and different-type item
    pairs.
- name: evidence_bet_validity
  summary: Audit adaptive evidence wagers under simple or composite nulls, varying revealed information
    and payoff rules; determine whether capital remains a supermartingale and locate the first violating
    history.
- name: switched_capacitor_charge_redistribution
  summary: Track charge through capacitor terminal reconnections, isolated conductor splits, and voltage
    clamps using charge conservation at each switch; return final voltages, capacitor charges, or source
    charge transfer.
