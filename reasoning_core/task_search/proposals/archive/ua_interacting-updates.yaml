pool:
- name: sequential_likelihood_stopping
  summary: Accumulate evidence along ordered observations with history-dependent likelihoods, scheduled
    inspections, and asymmetric stopping boundaries; return the first stopping time and decision, or continuation.
- name: stopping_rule_likelihood_equivalence
  summary: Compare evidence from fixed-sample, sequentially stopped, and censored experiments by constructing
    likelihoods over shared hypotheses; return whether two records have proportional likelihoods.
- name: ascertainment_conditioned_likelihood
  summary: Compare hypotheses after threshold screening, outcome-dependent reporting, or case enrichment
    using stated selection probabilities; return the likelihood ratio conditional on inclusion.
- name: pooled_distinctness_reconstruction
  summary: Overlapping pools report exact, bounded, or saturated counts of distinct hidden types rather
    than item counts; reconcile one global partition and recover forced same-type and different-type item
    pairs.
- name: coalition_excess_balancing
  summary: Allocate a fixed payoff by lexicographically minimizing descending coalition dissatisfaction
    across overlapping claims, individual floors and coalition values; answer the allocation or successive
    excess thresholds.
- name: strided_storage_aliasing
  summary: Execute assignments through overlapping, reversed, broadcast, and strided views under snapshot
    or sequential read semantics; return selected cells or identify the first write that changes a later
    read.
- name: tombstone_resurrection_tracking
  summary: Track versioned writes, deletions, delayed replication, read repair, and tombstone expiry across
    replicas under supplied reconciliation rules; return visible values or the event that resurrects deleted
    data.
- name: wash_sale_basis_chains
  summary: Propagate deferred losses through partial lot sales and replacement purchases under supplied
    matching windows and priorities; return recognized gains, remaining lot bases, or permanently disallowed
    losses.
- name: buoyancy_overflow_accounting
  summary: Track water displacement as cargo moves between floating vessels, the water, and shore, with
    filling, draining, and irreversible overflow; return water levels, spilled volume, or vessel flotation
    status.
- name: switched_capacitor_charge_redistribution
  summary: Track charge through capacitor terminal reconnections, isolated conductor splits, and voltage
    clamps using charge conservation at each switch; return final voltages, capacitor charges, or source
    charge transfer.
- name: insurance_limit_reinstatement
  summary: Process claims across deductibles, layered coverage, shared aggregate limits, and paid reinstatements
    under supplied erosion rules; return claim recoveries, remaining coverage, or total reinstatement
    cost.
- name: shared_extent_liveness
  summary: Track physical storage through extent sharing, partial copy-on-write updates, truncation, snapshots,
    and deletion of open files; return allocated space, reclaimable space, or the holders retaining an
    extent.
- name: photochromic_layer_feedback
  summary: Propagate light pulses through layered materials whose accumulated absorbed dose triggers bleaching
    or darkening between pulses; return layer states, transmitted dose, or the first threshold-crossing
    pulse.
- name: margin_liquidation_feedback
  summary: Apply price shocks and forced sales under supplied margin, liquidation, and market-impact rules,
    recomputing all accounts after each sale batch; return surviving positions, defaults, or terminal
    prices.
- name: persistent_reporter_fault_localization
  summary: Overlapping reports share latent binary event traces, while each source has a persistent truthful,
    inverted, stuck, or lagged behavior; identify source behaviors forced by global consistency.
- name: latent_heat_contact_sequences
  summary: Update bodies through ordered thermal contacts, separations, and heat injections with finite
    heat capacities and latent heat plateaus; return final temperatures, phase fractions, or heat transferred.
- name: rational_interference_conditioning
  summary: Apply path mixing, phase flips, and selected detections to rational-amplitude networks, tracking
    interference and branch normalization; return an output probability or the probability of an outcome
    sequence.
- name: strided_alias_reconstruction
  summary: Partially observed writes and readbacks across unknown strided, reversed, and overlapping array
    views constrain shared storage; recover which queried cell pairs must alias or cannot alias.
