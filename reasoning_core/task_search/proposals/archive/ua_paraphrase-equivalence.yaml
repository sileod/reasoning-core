pool:
- name: gapping_parallelism_recovery
  summary: Recover omitted predicates in coordinated clauses using supplied remnant correspondences; vary
    contrastive arguments, shared adjuncts and nested coordination; answers give the reconstructed clause.
- name: respectively_dependency_expansion
  summary: Expand respectively constructions by pairing coordinated arguments and modifiers at their licensed
    syntactic scopes; handle nested lists and shared constituents, returning the resulting atomic predications.
- name: plural_cover_equivalence
  summary: Collective, distributive and groupwise predications with explicit covers of plural entities;
    expand nested distribution and shared participants, then compare the resulting predicate obligations.
- name: exhaustification_equivalence
  summary: Disjunctions, numeral scales and contrastive alternatives with local or global exhaustification;
    derive innocently excludable alternatives through nested operators and compare strengthened meanings.
- name: interventional_cause_equivalence
  summary: Prevention, enabling, omission and nested counterfactual clauses under stated causal mechanisms;
    evaluate their outcome dependencies across single and joint interventions and decide semantic equivalence.
- name: spatial_perspective_equivalence
  summary: Locative sentences mixing viewer-relative, object-intrinsic and absolute directions; compose
    explicitly oriented reference frames through nested descriptions and compare the spatial relations
    asserted.
- name: evidence_reuse_equivalence
  summary: Compare sentences combining independent support, alternative derivations and repeated use of
    one source; distinguish evidence identity from multiplicity and decide whether their support expressions
    coincide.
- name: shared_ownership_equivalence
  summary: Compare sentences allocating whole, fractional and overlapping ownership claims under stated
    composition rules; decide whether they permit exactly the same resource holdings and compatible extensions.
- name: oriented_boundary_equivalence
  summary: Compare verbal descriptions of oriented patches, reversed faces, internal seams and repeated
    layers; cancel oppositely oriented contributions and decide whether the resulting signed boundaries
    coincide.
- name: material_frame_equivalence
  summary: Compare sentences describing quantities attached to moving objects versus quantities sampled
    at fixed locations; compose stated deformations and decide whether both descriptions specify the same
    physical field.
