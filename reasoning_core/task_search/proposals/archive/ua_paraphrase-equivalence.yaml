- name: portmanteau_spellout
  summary: Realize adjacent grammatical features using competing single-feature and portmanteau exponents
    under supplied precedence rules; vary blocking boundaries and contextual allomorphs; answers give
    the surface word.
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:ua_parsing-and-agreement:P003
      relationship: adjacent
      overlap: Both involve realizing morphological exponents from features, but case-stacking realizes
        ordered case suffixes, while portmanteau spellout resolves competing single vs. fused exponents
        under precedence.
    - id: proposal:ua_parsing-and-agreement:P004
      relationship: adjacent
      overlap: Both deal with affix realization, but suspended affix reconstruction recovers omitted morphology
        in coordination, not portmanteau competition.
    - id: proposal:k3_controlled-nli:P004
      relationship: different
      overlap: 'No shared operation: copredication is semantic, not morphological.'
    substantive_difference: C008 focuses on the competition between portmanteau and single-feature exponents
      under precedence and blocking, a distinct morphological computation not covered by case stacking
      or affix reconstruction. It has a well-defined output (surface word) and coverage rules.
    scores:
      novelty: 5
      sft_value: 4
      feasibility: 4
      clarity: 4
    reason: 'New operation: portmanteau exponent competition with precedence rules, distinct from known
      morphology tasks.'
    votes: 2/3
    dissent:
    - variant
- name: focus_alternative_projection
  summary: Compute alternatives induced by focused constituents under supplied composition rules across
    predicates, modifiers, conjunction, and nested focus operators; return the resulting alternative denotations.
