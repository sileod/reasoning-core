pool:
- name: contextual_marginal_extension
  summary: Determine whether overlapping local probability tables admit a common joint distribution; vary
    parity exclusions, shared marginals, and hidden outcomes; answer compatibility or a forced event bound.
- name: preference_separability_deduction
  summary: Infer consequences of additive attribute preferences from comparisons of composite options;
    vary shared attributes, tradeoff chains, ties, and incomplete rankings; answer forced comparison or
    inconsistency.
- name: diffraction_motif_abduction
  summary: Infer hidden repeating motifs from allowed and extinguished reflections using supplied phase-addition
    rules; vary translated copies, signed weights, and incomplete observations; answer compatible motifs.
- name: qualitative_limit_path_dependence
  summary: Determine whether multivariable expressions approach one value across all admissible paths;
    vary rational forms, piecewise boundaries, and constrained approaches; answer the limit or two conflicting
    path limits.
