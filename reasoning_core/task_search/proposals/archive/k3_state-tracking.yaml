pool:
- name: functional_graph_orbit_queries
  summary: 'Iterate an arbitrary map on a finite set: values at huge step counts via cycle arithmetic,
    the coalescence step of two starts, basin sizes around each cycle, or preimage counts at queried depth.'
- name: spn_cipher_round_replay
  summary: Execute rounds of a toy substitution-permutation network with per-instance S-box, cell permutation,
    and key schedule; answers give the state after k rounds, the ciphertext, or the first round meeting
    a stated predicate.
- name: vector_clock_causality
  summary: Advance vector clocks along per-process event chains joined by message edges; adjudicate a
    queried pair as ordered or concurrent, list the events concurrent with a cut, or find the earliest
    common descendant.
- name: causal_timestamp_ordering
  summary: Propagate vector clocks across per-process event chains linked by stated send/receive pairs;
    classify queried event pairs as happens-before, concurrent, or after; list all events concurrent with
    a target or a cut's frontier set.
- name: factor_elimination_marginals
  summary: 'Compute query marginals in small belief networks: following a stated elimination order, multiply
    factor tables and sum out variables; answers are exact rational marginals, an intermediate factor,
    or the normalizer.'
- name: vertex_elimination_fill_accounting
  summary: Eliminate vertices in turn under a stated min-degree or min-fill rule, adding fill edges that
    complete each removed vertex's neighborhood; answer the fill added per step, the largest clique formed,
    or the final order.
- name: qualitative_relation_closure
  summary: Asserted relations from an interval or region algebra with the supplied composition table;
    compose transitively for the strongest implied relation between a queried pair, or name the assertion
    to retract for consistency.
- name: regex_derivative_residuals
  summary: Differentiate extended regular expressions symbol by symbol under stated simplification rules;
    answer whether a string is accepted, the residual expression after a given prefix, or the first mismatching
    position.
- name: linker_archive_binding
  summary: Scan object modules and archives in link order, extracting archive members only to settle pending
    undefined symbols; answer a queried symbol's binding, the first unresolved name, or which members
    get extracted.
- name: pairwise_margin_tournament
  summary: Turn ranked-ballot profiles into the pairwise margin matrix; answer whether a Condorcet winner
    exists, Copeland win tallies and the induced ranking, who sits in the top cycle, or the margin of
    a queried pairing.
- name: permutation_rearrangement_tracking
  summary: Track labeled items through rearrangements composed in cycle notation (shuffles, rotor wirings,
    deals); answer an item's landing position, the composite permutation in cycles, or the period of a
    composition.
- name: ranked_ballot_elimination_transfer
  summary: 'Instant-runoff counting over ranked ballots: retally first choices, drop the lowest candidate,
    transfer those ballots downward as exhausted ones leave; answers are round tallies, the round a named
    candidate falls, or the winner.'
- name: subgroup_coset_enumeration
  summary: 'Enumerate cosets of a specified subgroup in a small presented group: complete coset tables
    by scanning relators and merging coincident rows; answers are the index, the coset of a queried word,
    or whether two words share a coset.'
- name: bom_netting_explosion
  summary: 'Explode end-item demand through a multi-level bill of materials: scale by per-unit usage,
    net against on-hand stock, round to lot sizes, and shift by lead times; answers are per-part net requirements
    per period or the first shortage.'
- name: announcement_knowledge_audit
  summary: 'Kripke models with valuations and per-agent accessibility: execute public announcements, each
    deleting worlds where it fails; answer whether an agent knows a fact, which announcement first creates
    ignorance, or how many worlds remain.'
- name: ranked_ballot_transfer_count
  summary: 'Ranked ballots, a seat quota, weakest-candidate elimination and surplus transfers: recount
    standings after every event; answer the full election order, which transfer first flips a race, or
    the exhausted-ballot tally.'
- name: interval_relation_closure
  summary: Premises state before/meets/overlaps/during relations (with inverses) among events; compose
    and tighten to closure; answer the strongest relation implied between a queried pair or which premise
    first conflicts.
- name: veracity_web_fixed_point
  summary: 'Truth-teller/liar webs whose utterances name others'' types, nested claims, or liar counts:
    propagate forced types and test consistency; answer the full assignment, which nodes stay free, or
    the inconsistency witness.'
- name: phonological_rule_interaction
  summary: Ordered phonological rules over feature bundles rewrite underlying forms, creating or destroying
    later rules' environments; answer surface forms, whether two rules feed, bleed or counterbleed, or
    which rule never fires.
- name: argument_acceptance_labeling
  summary: 'Attack graphs over arguments: repeatedly accept arguments whose attackers are all rejected
    and reject those with an accepted attacker until stable; answer the labeling, one argument''s status,
    or the seed deciding a contested node.'
- name: fluent_inertia_projection
  summary: Given events that initiate, terminate, or release fluents on a timeline, project fluent truth
    by inertia between affecting events; answers are fluent truth at a queried time, its maximal true
    intervals, or the earliest time it holds.
- name: marginal_share_settlement
  summary: 'Worth tables for every coalition of a few players: average each player''s marginal contribution
    across arrival orders; answers are exact shares, the pivotal player in a stated order, or a coalition
    blocking a proposed split.'
