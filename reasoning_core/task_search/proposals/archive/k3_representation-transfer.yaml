pool:
- name: bresenham_raster_trace
  summary: Rasterize line segments (all octants) and circles with exact integer error-term updates, returning
    the ordered pixel list, the pixel chosen at a queried step, or the decision value at a queried row.
- name: prufer_coding
  summary: Encode a labeled tree as its Prufer sequence or decode a sequence back into edges by repeatedly
    stripping or attaching the smallest available leaf; answer is the code word or the edge list.
- name: alphabeta_cutoff_trace
  summary: Run alpha-beta over an explicit valued game tree with fixed move order, tracking the window
    and logging each cutoff; vary depth, branching, and ordering; answer is the root value and pruned-leaf
    set.
- name: prufer_sequence_coding
  summary: "Encode labeled trees as Pr\xC3\xBCfer sequences and decode sequences back into edge lists,\
    \ over varied tree shapes, label sets, and code lengths, with answers as the exact sequence or sorted\
    \ edge list."
- name: permutation_lehmer_ranking
  summary: Convert permutations among cycle notation, one-line form, and inversion vectors, and rank or
    unrank them lexicographically across mixed sizes and cycle structures; answers are the requested equivalent
    representation.
- name: allen_interval_relation_composition
  summary: Map interval endpoint orderings to the thirteen Allen relations, then compose chained relations
    through the composition table over varied orderings; answers are the feasible relation set between
    the outermost endpoints.
