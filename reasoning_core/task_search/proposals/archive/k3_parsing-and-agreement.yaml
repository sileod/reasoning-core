pool:
- name: scalar_implicature_evaluation
  summary: Compute literal versus strengthened readings of scalar terms (some, or, numerals, possible)
    in plain, negated, conditional, and universally embedded contexts; answers are a verdict on a candidate
    implicature or the surviving reading.
- name: plural_predication_verdicts
  summary: Judge distributive, collective, cumulative and reciprocal (strong/intermediate) readings of
    plural sentences over atom, group and relation tables; answers are the true readings.
- name: valency_alternation_rewrite
  summary: "Rewrite clauses across valency alternations\xE2\x80\x94first- or second-object passive, impersonal\
    \ passive, dative shift, locative, causative and inchoative\xE2\x80\x94under a supplied verb-class\
    \ table; answer the rewritten clause or blocked."
- name: direct_inverse_inflection
  summary: 'Inflect transitive verbs in a synthetic direct-inverse system: compare arguments on a person-animacy
    hierarchy, assign proximate/obviative status among third persons, choose direct or inverse voice;
    answer the fully inflected forms.'
- name: topological_field_linearization
  summary: 'Serialize clauses from dependency structures with a topological-fields model: finite verb
    in V2 or final bracket, separable particles, midfield ordered by definiteness and case; answer the
    exact token sequence.'
- name: inflectional_paradigm_derivation
  summary: Inflect lexemes for feature bundles via stem-class tables, ordered mutation and affixation
    rules, suppletive and zero exponents, and haplology; answers are queried cells, full paradigms, or
    the feature bundle behind a form.
- name: valency_alternation_transformation
  summary: 'Apply a named valency change (passive, antipassive, causative, applicative) to a clause: promote/demote
    arguments, reassign case and agreement; add auxiliaries and adpositions, reorder; answers give the
    transformed clause string.'
- name: operator_scope_permutations
  summary: From c-command heights of quantifiers, negation, and modals, plus clause-bounded islands and
    freezing, enumerate the licensed scope permutations; answers give the reading count or the n-th reading's
    operator order.
