pool:
- name: robust_counterfactual_regret
  summary: Compare interventions across coupled uncertainty scenarios, measuring each loss against the
    best alternative in that same scenario; return the minimum-worst-regret intervention or its adversarial
    witness.
- name: pairwise_agenda_control
  summary: Resolve sequential pairwise elections with fixed preferences, constrained agenda positions,
    and alternative tie rules; answer whether a designated option can win or the minimum agenda edits
    needed.
- name: consensus_cut_minimum
  summary: Split a line into alternating signs so each piecewise-constant valuation has its prescribed
    signed total; vary overlapping supports, target imbalances, and fixed endpoint signs; answer the fewest
    cuts or impossibility.
- name: multirate_influence_coefficient
  summary: Trace input influence through branched cascades of rational filters, upsampling, downsampling,
    and phase shifts; return one input sample's exact coefficient in a queried output sample.
- name: analytic_germ_cancellation
  summary: Propagate truncated series through nested sums, products, quotients, exponentials, and logarithms
    with rational expansion constants; return the first surviving term through the specified order.
- name: delimited_resumption_evaluation
  summary: Evaluate effect handlers that discard, resume, or duplicate captured continuations across nested
    deep and shallow handlers; return the resulting value or the first unhandled effect.
- name: switched_capacitor_charge_transfer
  summary: Reconcile conserved node charge with voltage constraints through capacitor reconnections, floating
    islands, shorts, and source clamps; return a final capacitor voltage or net charge drawn from a source.
