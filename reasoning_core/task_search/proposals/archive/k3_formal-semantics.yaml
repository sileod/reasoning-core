- name: event_driven_gate_simulation
  summary: 'Event-simulate a gate netlist with input waveforms and per-gate transport or inertial delays:
    process the time-ordered queue, cancel stale pulses; vary fanout and reconvergent paths; answer the
    timed output waveform and glitch list.'
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: task:generated.wave9.event_queue_simulation.event_queue_simulation:EventQueueSimulation
      relationship: adjacent
      overlap: Both process a time-ordered event queue, but one is general discrete-event simulation and
        the other is specifically gate-level logic with transport/inertial delays and pulse cancellation.
    - id: task:generated.k3_counterfactual_r1.boolean_network_knockout.boolean_network_knockout:BooleanNetworkKnockout
      relationship: adjacent
      overlap: Both simulate digital circuits/networks, but one uses synchronous updates and the other
        uses event-driven timing with delays.
    - id: task:generated.wave9.round_robin_scheduling.round_robin_scheduling:RoundRobinScheduling
      relationship: different
      overlap: One is gate-level timing simulation, the other is CPU scheduling; no shared operation.
    substantive_difference: Event-driven simulation with transport/inertial delays and glitch cancellation
      is a distinct operation not covered by general event queues or synchronous Boolean networks.
