pool:
- name: observed_remove_reconciliation
  summary: Reconcile replicated sets whose additions carry unique tags and removals erase only observed
    tags; vary concurrent re-additions, delayed exchanges, and repeated merges; return surviving members.
- name: finite_back_and_forth_rank
  summary: Compare finite relational structures with named tuples by extending partial isomorphisms under
    alternating element choices; return the least distinguishing game length or survival through a given
    bound.
- name: dependency_quantifier_realizability
  summary: Solve finite quantified constraints where each existential choice sees only designated universal
    variables; vary dependency overlap and relation arity, returning realizability or a requested strategy
    table.
- name: intuitionistic_kripke_forcing
  summary: Evaluate intuitionistic formulas on finite ordered worlds with persistent predicates and constant
    or expanding domains; return forcing worlds or a verdict, respecting future-world implication and
    quantification.
- name: evidence_reuse_equivalence
  summary: Compare sentences combining independent support, alternative derivations and repeated use of
    one source; distinguish evidence identity from multiplicity and decide whether their support expressions
    coincide.
