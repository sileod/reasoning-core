pool:
- name: concurrent_edit_rebasing
  summary: Rebase concurrent insertions, deletions, and replacements through intervening text edits, preserving
    intended targets under overlap and stated tie rules; return the transformed edit or reconciled text.
- name: brzozowski_derivative_normal_form
  summary: Compute Brzozowski derivatives of regular expressions over union, concatenation and star; answers
    give the simplified residual after a symbol string, a nullability flag, or the first symbol whose
    residual is empty.
- name: evidence_mass_fusion
  summary: Combine evidence masses on overlapping subsets through discounting, conjunctive fusion, and
    stated conflict redistribution; return a queried fused mass, belief, or plausibility.
