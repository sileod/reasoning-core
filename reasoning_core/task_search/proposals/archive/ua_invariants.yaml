pool:
- name: residue_polynomial_function_equivalence
  summary: Compare polynomial expressions as functions over composite residue rings, allowing nested products
    and substitutions; extract finite-difference invariants and report equivalence or a separating residue.
- name: monomial_quotient_dimension_profile
  summary: Monomial relations with redundant generators, weighted degrees, and truncation bounds; identify
    surviving monomials and return graded quotient dimensions invariant under changes of presentation.
- name: rational_derivative_residue_class
  summary: Split rational functions with repeated poles, polynomial parts, and canceling factors; extract
    residues invariant under adding rational derivatives and decide class equality or rational integrability.
- name: isotropic_moment_contraction
  summary: Uniform-sphere polynomial averages specified by direction Gram matrices, including repeated
    projections and mixed sums; eliminate odd terms and contract even products to return the exact expectation.
- name: algebraic_norm_descent
  summary: Elements in finite extension towers given by defining polynomials, basis expressions, or rational
    combinations; descend conjugation-invariant norms through intermediate fields and return the ground-field
    value.
