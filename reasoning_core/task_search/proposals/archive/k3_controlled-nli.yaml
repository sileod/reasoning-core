- name: implicative_factive_inference
  summary: Implicative and factive verbs (manage, fail, remember, pretend) under negation and conditional
    or question embedding; compute whether the complement is entailed, denied or open; also judge equivalence
    with the bare assertion.
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:k3_paraphrase-equivalence:P004
      relationship: different
      overlap: different lexical domain (modals vs. implicative/factive verbs); both about polarity but
        distinct mechanisms
    - id: proposal:k3_synthetic-grammars:P001
      relationship: adjacent
      overlap: entailment diagnostics under adverbial contexts, but P001 is aspectual class not verb semantics
    - id: proposal:k3_paraphrase-equivalence:P006
      relationship: different
      overlap: morphological voice, not semantic factivity
    substantive_difference: C007 focuses on lexical entailment patterns of implicative/factive verbs under
      negation and embedding; no known task covers this specific semantic verb class.
    scores:
      novelty: 5
      sft_value: 4
      feasibility: 4
      clarity: 4
    reason: No known neighbor handles the entailment/denial/open distinction for factive and implicative
      verbs.
    votes: 2/3
    dissent:
