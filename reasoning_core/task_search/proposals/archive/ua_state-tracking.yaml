pool:
- name: rational_derivative_residue_class
  summary: Split rational functions with repeated poles, polynomial parts, and canceling factors; extract
    residues invariant under adding rational derivatives and decide class equality or rational integrability.
- name: stratified_liquid_transfer
  summary: Track ordered liquid layers through top or bottom withdrawals, partial pours, vessel inversion,
    and explicit mixing; preserve quantities and return a queried vessel's layers or withdrawn composition.
- name: chromatid_exchange_tracking
  summary: Track labeled chromosome segments through reciprocal crossovers, nonreciprocal conversion tracts,
    and chromatid segregation; return a queried product's haplotype or the ancestry of selected loci.
- name: insurance_layer_reinstatement
  summary: Apply ordered claims to coverage layers with occurrence retentions, aggregate deductibles,
    exhaustion, and limited reinstatements; return a queried claim's payment or each layer's remaining
    capacity.
- name: wash_sale_basis_propagation
  summary: Track partial-lot losses and replacement purchases across matching windows and security-equivalence
    groups; propagate deferred losses into replacement basis and return recognized loss or queried lot
    basis.
- name: lease_fencing_execution
  summary: Track lease grants, expirations, renewals, epoch tokens, and delayed writes across clients;
    distinguish lease ownership from storage fencing and return accepted writes or the final protected
    value.
- name: cut_flip_restack_tracking
  summary: Track labeled sheet stacks through aligned cuts, packet flips, rotations, and ordered restacking;
    preserve face orientation and spatial registration and return the layer sequence at a queried location.
- name: railway_interlocking_state
  summary: Execute route requests, track occupations, point changes, cancellations, and timed releases
    under approach and flank locking; return a queried signal aspect, locked resource set, or denied transition.
- name: hazard_pointer_reclamation
  summary: Execute interleaved pointer loads, hazard publication, validation, retirement, scans, and address
    reuse; track object generations and return reclaimed objects or the first access to reclaimed storage.
