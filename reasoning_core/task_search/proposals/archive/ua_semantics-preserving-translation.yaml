- name: simplicial_operator_normalization
  summary: Normalize composites of dimension-indexed face and degeneracy maps using index-shift and cancellation
    identities; return the canonical operator word or its omitted and repeated vertex indices.
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:ua_compositional-generalization:P010
      relationship: different
      overlap: 'Both involve symbolic rewriting with algebra rules (fermionic anticommutation vs. simplicial
        face/degeneracy index shifts). But the operations are distinct: fermionic normal ordering uses
        anticommutation/contractions, while simplicial normalization uses index shifts and cancellations
        in simplicial sets. Different rule systems and different normal forms.'
    - id: task:generated.k3_semantics_preserving_translation_r1.simplicial_boundary_matrices.simplicial_boundary_matrices:SimplicialBoundaryMatrices
      relationship: adjacent
      overlap: 'Both deal with simplicial complexes, but C005 normalizes operator words (face/degeneracy
        maps) while the neighbor computes boundary matrices. Different operations: algebra normalization
        vs. matrix construction.'
    - id: gallery:lambda_reduction
      relationship: different
      overlap: Both normalize symbolic expressions, but lambda reduction is about function application,
        not simplicial operator composition rules. Completely different rule systems.
    substantive_difference: The operation of canonicalizing composites of face and degeneracy maps via
      index shifts is a specific algebraic normalization not present in the catalog. It requires precise
      index arithmetic and cancellation rules that are distinct from fermionic or other rewrites.
