- name: generator_reentry_trace
  summary: Resume nested generators through yield-from delegation, sent values, closes, and mutable suspension
    frames without replaying completed steps; answer emitted order, live frames, or the stale binding
    on re-entry.
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:UNBUILT:P015
      relationship: adjacent
      overlap: Both trace control-flow and state across nested execution contexts, but C001 tracks generator
        delegation and suspension frames while P015 handles exceptions and finalizers.
    - id: task:generated.wave9.call_stack_trace.call_stack_trace:CallStackTrace
      relationship: adjacent
      overlap: Both involve nested call structures and returning values/traces at points, but C001 is
        specifically about generator yield-from and re-entry semantics, not recursion frames.
    - id: proposal:k3_paraphrase-equivalence:P002
      relationship: different
      overlap: 'Tree transducer runs differ from generator re-entry: C001 involves suspension and sent
        values, P002 is top-down tree rewriting.'
    substantive_difference: "C001's operation centers on generator delegation with yield-from, sent values,\
      \ closes, and re-entry into suspended frames \u2014 a distinct control-flow model not covered by\
      \ exception or recursion trace neighbors."
    scores:
