pool:
- name: hash_ring_reassignment
  summary: Map keys to node successors on a stated modular hash ring, then process node joins and removals
    in order; answers give each key's owner at a point, which keys migrate at an event, or the event that
    first displaces a queried key.
- name: ordered_pattern_coverage
  summary: Drive scrutinees through ordered constructor patterns with aliases, ranges, wildcards, or-branches,
    and guards, tracking residual spaces; answer selected arm, first redundant arm, or uncovered constructors.
- name: channel_protocol_residues
  summary: Advance send, receive, choose, offer, delegate, recurse, and close actions over typed channels
    among interleaved participants; answer residual endpoint protocols, who may move, or first protocol
    break.
- name: closure_frame_chronicle
  summary: Interpret nested functions whose captures bind shared frames or copy bindings, with later rebinding
    and delayed calls; answer queried values, which closure sees an update, or which frame changes last.
- name: generator_resume_state_trace
  summary: Advance generators through yield, send, delegation, return, and close steps while preserving
    their suspended locals; report the emitted sequence, a queried suspended state, or the eventual return.
- name: variance_override_validation
  summary: Track positive, negative, and invariant polarity through nested generic constructors, function
    arrows, and aliases; report a queried parameter's allowed polarity or the first occurrence that breaks
    an override.
- name: window_frame_cell_evaluation
  summary: Evaluate row-valued queries over partitions and ordered keys using lag/lead, rank, and running
    or range frames with ties and null policy; report values at queried cells or a row's frame membership.
- name: pattern_clause_analysis
  summary: Run ordered constructor patterns, nested with or-branches and guards, under first-match semantics,
    then audit for shadowed rows and uncovered constructor sets; answers are the firing clause with bindings
    or the missing cases.
- name: functional_dependency_closure
  summary: Close attribute sets under FD lists, prune supersets to candidate keys, and hunt normal-form
    violations across left-reduced and overlapping covers; answers are a closure, the key list, or a violating
    dependency.
- name: link_symbol_resolution
  summary: 'Resolve symbols across objects and archives: strong definitions beat weak, commons merge,
    archive members are pulled only to satisfy undefined names in scan order; answers are each reference''s
    defining module or the unresolved set.'
