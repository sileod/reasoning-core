pool:
- name: replacement_lot_basis_transfer
  summary: Apply supplied loss-deferral rules across partial sales, replacement windows, stock splits,
    and repeated resales; track transferred losses through replacement lots and return recognized loss
    or adjusted basis.
- name: evidence_conflict_redistribution
  summary: Combine evidence expressed as weighted candidate sets, ambiguous reports or compatibility tables
    by intersecting focal sets and renormalizing conflict; return belief, plausibility or total incompatibility.
- name: tropical_corner_transfer
  summary: Translate univariate min-plus polynomials between coefficient lists and weighted breakpoint
    descriptions, accounting for inactive terms and affine offsets; recover a corner, slope or normalized
    coefficient.
- name: layered_occlusion_repair
  summary: Update visible regions after inserting, moving, recoloring, or removing opaque layers over
    discrete canvases; resolve newly exposed overlaps and return only regions whose visible label changes.
- name: oriented_boundary_repair
  summary: Update the signed boundary of an oriented cell assembly after cell insertion, deletion, or
    reversal; combine shared-face contributions and return only faces whose net boundary coefficient changes.
- name: piecewise_envelope_repair
  summary: Repair upper or lower envelopes after inserting, deleting, or editing domain-limited affine
    pieces; account for intersections, ties, and gaps, returning changed winner intervals and their new
    expressions.
- name: adaptive_partition_rebalance
  summary: Repair rectangular subdivision meshes after local refinement or requested coarsening; enforce
    stated neighbor depth bounds with minimal additional splits, returning changed leaves or a blocked
    coarsening.
- name: paragraph_reflow_resynchronization
  summary: Repair cached line layouts after token or width edits under wrapping, glue, and discretionary-break
    rules; track spill and pullback until unchanged suffix alignment, returning changed lines.
- name: signed_boundary_patch
  summary: Patch oriented cell assemblies under insertion, deletion, or orientation reversal; propagate
    signs through face identifications and self-gluings, cancel shared incidences, and return changed
    boundary coefficients.
