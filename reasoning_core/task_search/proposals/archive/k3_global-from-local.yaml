pool:
- name: cumulative_edge_bound_tightening
  summary: 'Apply edge finding to interval tasks sharing one resource: sum subset energies over earliest-start/latest-end
    windows, tighten bounds, or prove overload; answers are tightened windows, certifying subsets, or
    the clash found.'
- name: petri_net_firing_execution
  summary: 'Weighted place/transition nets with a marking: test enabling, fire a proposed transition sequence
    stepwise moving tokens by arc weight; answer the final marking, the first unenabled step, or the currently
    enabled set.'
- name: iterated_dominance_survivors
  summary: 'Two-player payoff tables with strict dominance: cross out dominated rows and columns, rechecking
    survivors after each removal; answer the surviving cell set, whether a single profile remains, or
    the next removable strategy.'
- name: factor_graph_variable_elimination
  summary: 'Small factor graphs over finite variables with a stated elimination order: multiply and marginalize
    factors in turn, then answer a normalized posterior, the max-product optimum''s value, or the total
    partition weight.'
- name: prufer_code_interconversion
  summary: "Labeled trees under the Pr\xC3\xBCfer bijection: encode a tree leaf by leaf, decode a sequence\
    \ back into its edge list, or realize the tree matching a stated degree sequence; answers are code\
    \ lists or edge lists."
- name: flowgraph_fixpoint_analyses
  summary: 'Small control-flow graphs with per-block gen and kill sets: iterate reaching-definition, liveness,
    or dominator equations to a fixpoint, then report the set at a queried block or the round each block''s
    value stabilizes.'
- name: comparator_network_zero_one_verification
  summary: 'Comparator networks on few wires: trace a given input through comparators, and judge sorting
    behavior by sweeping all binary inputs per the zero-one principle; answer output vectors, the verdict,
    or a smallest failing binary word.'
- name: ordered_rule_derivation_interactions
  summary: 'Ordered context-sensitive rewrite rules over feature segments: apply them serially from each
    underlying form, then answer surface strings, or classify a stated rule pair as feeding, bleeding,
    or counterfeeding from the derivations.'
- name: vector_clock_causality_audit
  summary: 'Event logs across processes with send-receive links: assign Lamport and vector timestamps
    by local propagation, then classify a queried event pair as ordered or concurrent, or flag the first
    pair violating a stated ordering claim.'
- name: symmetric_coloring_orbit_counts
  summary: 'Colorings of necklaces, bracelets, and polyhedron faces under stated symmetry groups: derive
    each element''s cycle structure on positions, count its fixed colorings with exact color tallies,
    and answer the orbit count.'
