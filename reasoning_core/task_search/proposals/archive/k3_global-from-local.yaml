- name: lindley_wait_propagation
  summary: 'Propagate waits through a single-server queue via the Lindley recursion over arrival and service
    sequences: carry each wait forward, marking busy periods; answers are a queried wait, busy-period
    spans, or peak backlog.'
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:k3_operations-research:P012
      relationship: adjacent
      overlap: Both propagate constraints or state through a resource/queue system, but one uses Lindley
        recursion on arrival/service sequences while the other tightens time windows.
    - id: proposal:k3_formal-semantics:P001
      relationship: adjacent
      overlap: Both are time-ordered simulations with event-like processing, but one is queueing waits
        and the other is digital logic delays.
    - id: task:generated.wave9.round_robin_scheduling.round_robin_scheduling:RoundRobinScheduling
      relationship: different
      overlap: One is FIFO queueing with Lindley recursion; the other is round-robin time-slicing of processes.
    substantive_difference: Lindley recursion specifically propagates waiting times as max(0, W + service
      - interarrival), giving busy periods and peak backlog, which is distinct from gate simulation or
      scheduling.
    scores:
      novelty: 5
      sft_value: 5
      feasibility: 5
      clarity: 5
    reason: Queueing-theoretic Lindley recursion with busy-period analysis is not represented in the catalog.
