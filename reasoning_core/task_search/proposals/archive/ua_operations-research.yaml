pool:
- name: finite_back_and_forth_rank
  summary: Compare finite relational structures with named tuples by extending partial isomorphisms under
    alternating element choices; return the least distinguishing game length or survival through a given
    bound.
- name: ascertainment_conditioned_likelihood
  summary: Compare hypotheses after threshold screening, outcome-dependent reporting, or case enrichment
    using stated selection probabilities; return the likelihood ratio conditional on inclusion.
- name: sequential_likelihood_stopping
  summary: Accumulate evidence along ordered observations with history-dependent likelihoods, scheduled
    inspections, and asymmetric stopping boundaries; return the first stopping time and decision, or continuation.
- name: stopping_rule_likelihood_equivalence
  summary: Compare evidence from fixed-sample, sequentially stopped, and censored experiments by constructing
    likelihoods over shared hypotheses; return whether two records have proportional likelihoods.
- name: likelihood_principle_audit
  summary: Compare realized evidence across fixed, censored, and outcome-dependent stopping protocols;
    derive likelihood vectors over hypotheses and identify which records carry proportional evidence.
- name: counterfactual_coupling_bounds
  summary: Bound joint potential-outcome claims from experimental marginals, subgroup mixtures, and optional
    monotonicity restrictions; return sharp bounds on benefit, harm, or probability of necessity.
- name: adaptive_hypothesis_probes
  summary: Choose adaptive experiments separating finite hypotheses under deterministic predictions, unequal
    costs, restricted probes, and bounded response errors; return the minimax first probe and total cost,
    or infeasibility.
- name: coalition_excess_balancing
  summary: Allocate a fixed payoff by lexicographically minimizing descending coalition dissatisfaction
    across overlapping claims, individual floors and coalition values; answer the allocation or successive
    excess thresholds.
- name: policy_information_consistency
  summary: Audit contingent actions against information actually available from delayed, masked or action-dependent
    observations; answer forced action-equality groups or the earliest decision that uses unavailable
    knowledge.
- name: integer_balance_augmentation
  summary: Improve a bounded integer allocation through supplied balance-preserving directions under separable
    cost tables; vary sign compatibility and feasible step lengths, and answer the best direction, step
    and gain.
- name: coarsening_ignorability_audit
  summary: Check whether an observation mechanism assigns equal reporting probabilities to latent states
    compatible with each report; vary censoring, overlapping reports, and adaptive revelation; return
    ignorability or a violating pair.
- name: scenario_recombination_stress
  summary: Find the worst cumulative load after uncertainty scenarios are closed under allowed prefix-suffix
    recombinations; vary splice checkpoints and history restrictions, and answer the new worst path or
    conservatism gap.
- name: objective_perturbation_stability
  summary: Find the full parameter interval preserving a designated plan's optimality when costs vary
    affinely across feasible alternatives, including degeneracy and ties; answer the interval and limiting
    rivals.
- name: recourse_certificate_projection
  summary: Project downstream feasibility and cost certificates onto upstream decisions by canceling recourse
    variables; vary shared capacities and scenario coupling, and answer the induced cut or its violation.
- name: disjunctive_bound_convexification
  summary: Derive the tight convex relaxation of unions of bounded operating regimes with activation costs
    and minimum outputs; answer a queried envelope value or a separating inequality for a fractional operating
    point.
- name: adaptive_probe_valuation
  summary: Value inspections that reveal partitions of possible demand before an irreversible allocation;
    vary noisy signals, probe costs and sequential probe choices, and answer the optimal first probe or
    its net value.
- name: sequential_cut_lifting
  summary: Extend a valid packing inequality to omitted binary choices in a stated order, recomputing
    each coefficient over residual feasible packs; answer the lifted inequality or a queried coefficient.
- name: budgeted_uncertainty_counterpart
  summary: Replace uncertain resource loads with exact worst-case loads under shared deviation budgets,
    asymmetric ranges and grouped limits; answer a robust capacity requirement or an attaining deviation
    allocation.
