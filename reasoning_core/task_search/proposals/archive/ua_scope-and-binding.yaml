pool:
- name: branching_quantifier_dependence
  summary: Interpret quantified clauses whose witnesses may depend on only specified universal choices;
    vary shared witnesses, independent choices, and nested dependencies; return whether a legal witness
    assignment exists.
- name: counterfactual_similarity_selection
  summary: Interpret nested would and might counterfactuals using world-relative similarity rankings,
    tied closest worlds and stated empty-antecedent conventions; return the worlds satisfying each claim.
- name: focus_alternative_composition
  summary: Compose focus alternatives through predicates, quantifiers and nested focus domains using stated
    replacement sets; return the alternatives available to a designated focus-sensitive operator.
- name: binding_domain_admissibility
  summary: Determine admissible coindexings for reflexives, pronouns, and names across nested clauses,
    possessors, and exempt positions using stated locality and command rules; answer which links are licensed.
- name: discourse_center_transitions
  summary: Track preferred and backward-looking discourse centers under stated grammatical-role rankings,
    pronoun realization, and topic reintroduction; answer the center and transition category at a queried
    utterance.
