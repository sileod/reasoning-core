pool:
- name: finite_conditional_independence
  summary: Test independence in exact finite distributions after conditioning, marginalizing hidden variables,
    or coarsening outcomes; include mixture-induced dependence and cancellation; return which claims hold.
- name: contingency_cause_witness
  summary: In finite structural models, find admissible interventions that make a candidate event outcome-critical;
    range over redundancy, preemption, and conjunctive causes; return minimum contingency size or none.
- name: iterated_conditional_projection
  summary: Compute successive conditional expectations over weighted finite partitions that may overlap,
    refine, or cross; answer the resulting values or the discrepancy from conditioning directly on the
    final partition.
- name: sequential_likelihood_stopping
  summary: Accumulate evidence along ordered observations with history-dependent likelihoods, scheduled
    inspections, and asymmetric stopping boundaries; return the first stopping time and decision, or continuation.
- name: ascertainment_conditioned_likelihood
  summary: Compare hypotheses after threshold screening, outcome-dependent reporting, or case enrichment
    using stated selection probabilities; return the likelihood ratio conditional on inclusion.
- name: strided_storage_aliasing
  summary: Execute assignments through overlapping, reversed, broadcast, and strided views under snapshot
    or sequential read semantics; return selected cells or identify the first write that changes a later
    read.
- name: action_effect_induction
  summary: Infer action preconditions and conditional effects from before-and-after demonstrations, including
    toggles, consumption and enabling; determine the state after a new action sequence.
- name: stamp_compositing_induction
  summary: Infer registration offsets, transparent inks and knockout behavior from layered stamp demonstrations;
    apply unseen placements and layer orders to determine visible marks at queried positions.
- name: evidence_bet_validity
  summary: Audit adaptive evidence wagers under simple or composite nulls, varying revealed information
    and payoff rules; determine whether capital remains a supermartingale and locate the first violating
    history.
- name: coordinate_wiring_induction
  summary: Infer hidden coordinate mappings from address correspondences, varying axis order, reflections,
    block interleaving and conditional offsets; locate a queried item in a rearranged array.
- name: sensor_logic_induction
  summary: Infer hidden sensor conditions from controlled input demonstrations, varying conjunctions,
    parity, count thresholds and veto features; determine readings after specified input changes.
- name: noncommutative_identity_audit
  summary: Verify symbolic derivations with ordered products, distributivity, powers, inverses, and declared
    commutation pairs; locate the first unsupported equality or repair a missing factor or coefficient.
- name: tensor_axis_contract_audit
  summary: Audit named-axis tensor traces across broadcasting, contraction, permutation, and reshape;
    identify the first violated axis contract or the corrected dimension restoring the trace.
- name: causal_cut_repair
  summary: Check distributed snapshots against local event order and message send-receive dependencies;
    identify an orphan receive or compute the least snapshot extension containing every required predecessor.
- name: affine_quantity_audit
  summary: Audit quantity derivations involving unit scales, offset origins, absolute readings, and differences;
    locate the first invalid operation or recover the conversion that repairs it.
- name: rounding_consistency_audit
  summary: Check joint feasibility of rounded totals, differences, and weighted means under stated rounding
    rules; return the first incompatible claim or the tight feasible interval for a questioned value.
- name: edit_coordinate_audit
  summary: Audit insert, delete, and replace traces mixing original-text and evolving-text coordinates;
    track surviving anchors and return the first misplaced edit or its corrected target range.
- name: fold_layer_trace_audit
  summary: Verify strip-fold traces with unequal panels, alternating fold directions, and partial overlaps;
    track reflected positions and reversed layer stacks to locate or replace the first incorrect stack
    claim.
- name: insurance_limit_reinstatement
  summary: Process claims across deductibles, layered coverage, shared aggregate limits, and paid reinstatements
    under supplied erosion rules; return claim recoveries, remaining coverage, or total reinstatement
    cost.
