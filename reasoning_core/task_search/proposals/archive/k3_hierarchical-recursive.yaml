pool:
- name: style_cascade_resolution
  summary: Compute effective styles on nested element trees by matching tag, class, and id selectors,
    comparing specificity then source order, and inheriting unset properties; answer is one element's
    value for a queried property.
- name: tree_reroot_aggregates
  summary: Compute for every node of a weighted tree the sum of distances to all other nodes, via an upward
    subtree pass then a downward reroot pass; vary branching and edge weights; answer is the per-node
    totals.
- name: cartesian_tree_construction
  summary: Build the min- or max-Cartesian tree of an array whose inorder traversal returns the array,
    using a monotone stack of nearest smaller or greater neighbors; vary ties; answer is each element's
    parent index and the root.
- name: skip_list_search_trace
  summary: Search a skip list with given node tower heights, moving right while the next key stays under
    target then dropping a level; queries mix present and absent keys; answer is the ordered sequence
    of keys inspected.
- name: addressed_tree_restructuring
  summary: 'Apply scripted structural edits to a labeled ordered tree, each addressed by a child-index
    path: swaps between two paths, binary rotations, and cut-and-graft moves; answer is the final tree
    or a tracked node''s new path.'
- name: tree_subset_counting_dp
  summary: 'Count combinatorial subsets of a rooted tree by bottom-up per-node states: independent sets,
    matchings, and vertex covers, exact or modulo a prime; answer is the root count.'
- name: spreadsheet_cell_evaluation
  summary: Evaluate grid cells holding constants or formulas with references, rectangular ranges inside
    aggregates, and dependency chains, detecting cycles and propagating errors; answer is the queried
    cell values in order.
