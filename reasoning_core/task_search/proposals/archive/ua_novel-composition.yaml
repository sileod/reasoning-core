pool:
- name: joint_marginal_extension
  summary: Reconcile overlapping marginal and conditional probability tables, structural zeros, and symmetry
    constraints into one joint law; answer global compatibility or a tight bound on an unobserved event.
- name: staged_pool_detection_likelihood
  summary: Evaluate pooled screening with finite inventories, overlapping pools, imperfect tests, and
    outcome-dependent retesting; return the likelihood of an observation sequence or a queried item's
    posterior status.
- name: replacement_lot_basis_transfer
  summary: Apply supplied loss-deferral rules across partial sales, replacement windows, stock splits,
    and repeated resales; track transferred losses through replacement lots and return recognized loss
    or adjusted basis.
- name: rounded_display_consistency
  summary: Recover feasible latent values from linked rounded readings; vary increments, tie rules, shared
    offsets, and sum displays, returning consistency or the tight interval for a queried quantity.
- name: fracture_redistribution_cascades
  summary: Apply load increments to elements that break above individual limits and redistribute their
    loads; vary sharing weights and simultaneous break sets, returning survivors or the failure wave of
    an element.
- name: boundary_extension_stencil_cascades
  summary: Apply successive local weighted stencils with periodic, reflected, fixed, or clamped boundaries;
    vary shrinking domains, downsampling, and boundary reapplication, returning selected final samples.
