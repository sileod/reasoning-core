      C001 computes a canonical basis from a static context.
  reason: 0/3 samples judged it novel; FCA with canonical basis is a known operation on the same incidence
    context, just adding a basis extraction mode.
  scores:
    novelty: 2
    sft_value: 3
    feasibility: 5
    clarity: 4
  votes: 0/3
