    lexicographically lowest point.
- name: shapley_value_computation
  summary: Enumerate player permutations of a small coalitional game given by a subset-to-value table,
    sum each player's marginal contribution, and return every Shapley value as a reduced fraction.
- name: linear_extension_count
  summary: Count the linear extensions of a small poset given by cover relations, branching over currently-minimal
    elements; answer is the exact number of valid topological orders.
- name: agglomerative_merge_trace
  summary: Run bottom-up agglomerative clustering over a small integer distance matrix under single, complete,
    or average linkage with a stated tie order, returning ordered merge pairs or the partition at a queried
    merge step.
- name: bpe_merge_trace
  summary: 'Iterate byte-pair merging over short token sequences: recount adjacent-pair frequencies, merge
    the top pair under a fixed tie-break, returning the sequence after k rounds, the pair merged at round
    t, or the final vocabulary.'
- name: arithmetic_coding_interval
  summary: Narrow a rational interval through successive cumulative-distribution slices, one per message
    symbol, or invert the process to recover symbols from a target fraction; return the final reduced
    endpoints or the decoded symbol sequence.
- name: planar_face_tracing
  summary: Trace faces of a combinatorially embedded planar graph by following its rotation system from
    stated directed edges, returning the boundary walk of a queried face, the multiset of face lengths,
    or the resulting genus.
