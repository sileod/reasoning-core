- name: nonstandard_base_translation
  summary: Translate integers between decimal and redundant positional systems - balanced ternary, bases
    -2 and -10, and binary non-adjacent form - in both directions with growing magnitudes; answer is the
    exact digit string in the requested system.
  id: P001
  novelty:
    verdict: novel
    nearest_neighbors:
    - id: proposal:k3_novel-composition:P008
      relationship: adjacent
      overlap: both involve converting between representations of integer or geometric quantities, but
        Bresenham rasterization maps coordinates to pixel steps while nonstandard-base translation maps
        integer values to digit strings in redundant bases
    - id: task:generated.k3_rule_induction_r1.repeating_decimal_expansion.repeating_decimal_expansion:RepeatingDecimalExpansion
      relationship: adjacent
      overlap: both convert between integer/rational values and a positional digit representation, but
        repeating decimals handle fractional parts and repetends while nonstandard bases cover balanced/negative
        bases with signed digits
    - id: task:generated.wave8.virtual_address_translation.virtual_address_translation:VirtualAddressTranslation
      relationship: adjacent
      overlap: both translate between numeric address representations and multi-field formats, but virtual
        address translation splits bits into page-table fields while nonstandard bases use digit weights
        and signed bases
    substantive_difference: Handles bidirectional conversion between integers and non-standard positional
      systems (balanced ternary, negative base, non-adjacent form) with digits possibly negative or with
      signed weights, a distinct representation-translation operation.
    scores:
      novelty: 5
      sft_value: 4
      feasibility: 5
      clarity: 5
    reason: Converting between decimal and non-standard bases like balanced ternary or negabinary is a
      novel representation-translation task not seen in the neighbors.
    votes: 2/2
    dissent: []
