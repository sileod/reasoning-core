    - id: task:generated.wave8.prefix_code_decode.prefix_code_decode:PrefixCodeDecode
      relationship: adjacent
      overlap: both involve encoding/decoding between a symbolic sequence and a binary/bit representation,
        but prefix codes use a codebook of variable-length codewords while UTF-8 follows a fixed multibyte
        length pattern with continuation bytes
    - id: proposal:k3_verification-repair:P007
      relationship: adjacent
      overlap: both perform exact encoding and decoding between a symbol sequence and a numerical interval
        or byte stream, but arithmetic coding uses cumulative probabilities and rational intervals, not
        character encoding standards
    - id: proposal:k3_verification-repair:P003
