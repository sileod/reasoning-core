pool:
- name: plural_predication_verdicts
  summary: Judge distributive, collective, cumulative and reciprocal (strong/intermediate) readings of
    plural sentences over atom, group and relation tables; answers are the true readings.
- name: quantifier_scope_equivalence
  summary: Sentences stacking quantifiers (every, each, a, exactly n) and negation in permuted surface
    orders; enumerate scope readings via commutation and duality; answer whether two sentences share all
    readings or give a separating model.
- name: connective_paraphrase_equivalence
  summary: Clauses joined by varied connectives (unless, only if, provided, or else, neither-nor, but)
    in either order; translate each to a Boolean formula; answer whether the pair is equivalent or give
    the truth assignment separating them.
- name: implicative_factive_inference
  summary: Implicative and factive verbs (manage, fail, remember, pretend) under negation and conditional
    or question embedding; compute whether the complement is entailed, denied or open; also judge equivalence
    with the bare assertion.
- name: degree_construction_equivalence
  summary: Comparative, superlative, equative, too/enough and correlative degree constructions over stated
    quantities; translate to order and threshold constraints; answer whether two wordings coincide or
    give the implied ranking.
- name: adjective_subsectivity_inference
  summary: Adjective stacks mixing intersective, subsective, privative and intensional classes in varied
    orders and bracketings; compute which inferences survive stacking and reordering; answer whether two
    forms denote identically.
- name: propositional_formula_equivalence
  summary: "Judge whether two propositional formulas over shared atoms with \xC2\xAC\xE2\x88\xA7\xE2\x88\
    \xA8\xE2\x86\x92\xE2\x86\x94\xE2\x8A\x95 denote the same truth function; answers give the equivalence\
    \ verdict, a counterexample valuation, or a formula's satisfying-row count."
- name: finite_model_quantifier_verification
  summary: Evaluate first-order formulas over explicit finite models with mixed and counting quantifiers;
    answers give a truth verdict, satisfying tuples for an open formula, or whether two differently quantified
    formulas share an extension.
- name: comparative_quantity_equivalence
  summary: 'Evaluate comparative claims over count tables: more/fewer than, as many as, twice/half as
    many, with difference vs ratio readings; answers give a truth verdict, the count gap, or whether two
    phrasings state the same relation.'
- name: aspectual_composition_classification
  summary: Compose verb class with objects, PPs, and operators (progressive, almost, in/for-PPs) and classify
    via entailment tests; answers label state/activity/accomplishment/achievement or judge telicity, homogeneity,
    culmination.
