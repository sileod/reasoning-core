  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_scientific_reasoning_r5/path_intervention_world_consistency_v1
  design_choice: Represent the answer as a canonical witness triple (nodeX, nodeY, nodeZ) when recanting
    exists, otherwise the string 'identifiable'
