- id: P004v1
  hypothesis: P004
  idea: attentional_blink_gating_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/ua_language_implementation_r1/attentional_blink_gating_v1
  instruction: |-
    Author a new task from scratch: attentional_blink_gating_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Track target admission through an attention gate with stated consolidation and recovery rules; vary distractor gaps, adjacent targets, and prolonged stimuli; answer admitted targets or the gate state.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/ua_language_implementation_r1/attentional_blink_gating_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_language_implementation_r1/attentional_blink_gating_v1
  design_choice: Answer as a list of admitted target indices in presentation order, e.g., '2,5' or 'none',
    with distractors never counted.
