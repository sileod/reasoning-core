    Author a new task from scratch: linear_extension_counting_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Count the linear extensions of a partial order by dynamic programming over its lattice of down-sets; answer the exact extension count, with trees handled by their hook-length product formula.

