  instruction: |-
    Author a new task from scratch: implicative_factive_inference_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Implicative and factive verbs (manage, fail, remember, pretend) under negation and conditional or question embedding; compute whether the complement is entailed, denied or open; also judge equivalence with the bare assertion.

