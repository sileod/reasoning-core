- id: P001v1
  hypothesis: P001
  idea: antichain_progress_completion_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/ua_language_implementation_r4/antichain_progress_completion_v1
  instruction: |-
    Author a new task from scratch: antichain_progress_completion_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Track progress frontiers in partially ordered timestamp spaces through advances, forks, and joins; determine which queried times are complete because no frontier element can still precede them.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/ua_language_implementation_r4/antichain_progress_completion_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_language_implementation_r4/antichain_progress_completion_v1
  design_choice: Instances are generated from a fixed set of timestamp coordinates with precedence edges;
    solvers must return a canonical list of complete queried times in sorted order.
