  instruction: |-
    Author a new task from scratch: automaton_word_counting_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Count the words an automaton accepts at a given length by subset dynamic programming over transition tables, including epsilon-NFAs and products of two machines; answer an exact count at one length or totals across a range.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/k3_scientific_reasoning_r3/automaton_word_counting_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/k3_scientific_reasoning_r3/automaton_word_counting_v1
  design_choice: Represent transitions as explicit integer-labeled edges over a compact alphabet of size
    2, with epsilon edges as zero-cost moves, and answer exact counts for a single length n.
