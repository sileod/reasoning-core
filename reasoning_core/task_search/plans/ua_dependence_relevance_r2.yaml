  idea: missingness_pattern_ignorability_v2 (variant 2 of 3)
  changes: new task in reasoning_core/tasks/generated/ua_dependence_relevance_r2/missingness_pattern_ignorability_v2
  instruction: |-
    Author a new task from scratch: missingness_pattern_ignorability_v2.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Classify finite missing-data mechanisms by whether each mask probability depends on values visible under that mask; vary structural zeros and realized versus all compatible records; answer the applicable ignorability class.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/ua_dependence_relevance_r2/missingness_pattern_ignorability_v2
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_dependence_relevance_r2/missingness_pattern_ignorability_v2
  design_choice: Vary whether structural zeros are present in the data-generating distribution; when they
    are, the mask probability is zero for certain masks, and the solver must decide if ignorability holds
    on the support of compatible records only.
