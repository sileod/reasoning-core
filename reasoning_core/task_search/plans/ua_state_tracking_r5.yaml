- id: P007v1
  hypothesis: P007
  idea: mean_preserving_spread_order_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/ua_state_tracking_r5/mean_preserving_spread_order_v1
  instruction: |-
    Author a new task from scratch: mean_preserving_spread_order_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Finite weighted outcome distributions with unequal supports and shared means; compare integrated tails to decide whether mean-preserving redistribution is possible or identify a violated strike inequality.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/ua_state_tracking_r5/mean_preserving_spread_order_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_state_tracking_r5/mean_preserving_spread_order_v1
  design_choice: Generate pairs where the two distributions have equal means but different supports, and
    the solver must output whether one is a mean-preserving spread of the other via a canonical yes/no
    string.
