    Author a new task from scratch: kinship_relation_resolution_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Resolve kinship queries on pedigree DAGs of parent links: locate the lowest common ancestors of two members, measure the up/down path lengths, and derive the cousin-degree/removal designation; answer is that designation.

