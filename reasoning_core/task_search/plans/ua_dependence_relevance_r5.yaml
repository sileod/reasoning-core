  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_dependence_relevance_r5/heap_assertion_separability_v1
  design_choice: 'Answer format: fixed binary truth value with no witness, forcing solvers to decide satisfiability
    of the whole assertion over a given heap diagram.'
