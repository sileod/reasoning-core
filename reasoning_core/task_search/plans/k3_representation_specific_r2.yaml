- id: P006v1
  hypothesis: P006
  idea: backdoor_adjustment_selection_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/k3_representation_specific_r2/backdoor_adjustment_selection_v1
  instruction: |-
    Author a new task from scratch: backdoor_adjustment_selection_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Given a causal DAG with named treatment and outcome plus candidate covariates such as mediators, colliders and instruments, choose a minimal valid backdoor adjustment set for effect estimation, or report that none qualifies.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/k3_representation_specific_r2/backdoor_adjustment_selection_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/k3_representation_specific_r2/backdoor_adjustment_selection_v1
  design_choice: 'Instance format: text adjacency list with explicit DAG edges, and answer is a canonical
    sorted comma-separated list of covariate names or the string ''NONE'''
