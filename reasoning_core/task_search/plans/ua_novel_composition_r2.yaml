  idea: robust_counterfactual_regret_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/ua_novel_composition_r2/robust_counterfactual_regret_v1
  instruction: |-
    Author a new task from scratch: robust_counterfactual_regret_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Compare interventions across coupled uncertainty scenarios, measuring each loss against the best alternative in that same scenario; return the minimum-worst-regret intervention or its adversarial witness.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/ua_novel_composition_r2/robust_counterfactual_regret_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_novel_composition_r2/robust_counterfactual_regret_v1
  design_choice: Represent scenarios as a small finite set of probability vectors over outcomes, with
    interventions as actions; answer is the action index minimizing max over scenarios of (best action
    loss - chosen action loss).
