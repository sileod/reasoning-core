  idea: invented_numeral_evaluation_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/k3_psychometrics_r5/invented_numeral_evaluation_v1
  instruction: |-
    Author a new task from scratch: invented_numeral_evaluation_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Evaluate and generate invented numeral systems built from stipulated additive, multiplicative, and subtractive morpheme rules; answers give a string's value, the canonical string for a value, or a well-formedness verdict.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/k3_psychometrics_r5/invented_numeral_evaluation_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/k3_psychometrics_r5/invented_numeral_evaluation_v1
  design_choice: Generate instances by fixing a random base set of 3-5 numeral morphemes with arbitrary
    numeric values, then derive all valid strings up to a bound; questions ask value, canonical form,
    or validity.
