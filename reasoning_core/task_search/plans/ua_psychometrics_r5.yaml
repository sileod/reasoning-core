- id: P005v1
  hypothesis: P005
  idea: ratchet_motion_rectification_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/ua_psychometrics_r5/ratchet_motion_rectification_v1
  instruction: |-
    Author a new task from scratch: ratchet_motion_rectification_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Convert alternating strokes into retained motion through ratchets with specified tooth pitches, pawl directions, and engagement windows; return net advance, the holding pawl, or the first ineffective stroke.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/ua_psychometrics_r5/ratchet_motion_rectification_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_psychometrics_r5/ratchet_motion_rectification_v1
  design_choice: Represent each stroke as a signed displacement and compute net advance by summing only
    strokes that fall within the engagement window, with pawl direction encoded as sign of window.
