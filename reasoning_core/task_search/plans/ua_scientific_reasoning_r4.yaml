  idea: sequential_bet_calibration_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/ua_scientific_reasoning_r4/sequential_bet_calibration_v1
  instruction: |-
    Author a new task from scratch: sequential_bet_calibration_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Given composite null transition laws and history-dependent betting payoffs, test whether accumulated evidence remains a supermartingale; return the first unsafe wager or maximal safe stake.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/ua_scientific_reasoning_r4/sequential_bet_calibration_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_scientific_reasoning_r4/sequential_bet_calibration_v1
  design_choice: Represent the history as a binary string and vary the length of the sequence; the answer
    is the index of the first wager where the conditional expected payoff exceeds the stake, or 'none'
    if all are safe.
