    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Compute exact single-variable marginal in a discrete factor graph by variable elimination or belief propagation; ranges over tree and loopy topologies, factor arities, and evidence configurations; answer is the marginal probability table.

