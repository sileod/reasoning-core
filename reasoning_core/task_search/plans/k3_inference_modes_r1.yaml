  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/k3_inference_modes_r1/linear_extension_counting_v1
  design_choice: Represent the partial order as a DAG of integer-labeled vertices, with instances generated
    by random edge insertion until a fixed width, and answers as exact integers.
