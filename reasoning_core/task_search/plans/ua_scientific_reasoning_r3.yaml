  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_scientific_reasoning_r3/sequential_bet_calibration_v1
  design_choice: Represent the composite null as a finite mixture of Markov chains with rational transition
    matrices, and detect unsafe wagers by exact fraction arithmetic over a bounded horizon.
