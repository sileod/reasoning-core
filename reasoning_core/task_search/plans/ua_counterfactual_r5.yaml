  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_counterfactual_r5/bounded_geometric_construction_v1
  design_choice: Instance targets are specified as exact algebraic points (e.g., cube root or golden ratio)
    on a fixed grid, forcing non-trivial constructions rather than simple bisections.
