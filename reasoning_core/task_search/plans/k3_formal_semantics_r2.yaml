- id: P003v1
  hypothesis: P003
  idea: natural_deduction_line_audit_v1 (variant 1 of 3)
  changes: new task in reasoning_core/tasks/generated/k3_formal_semantics_r2/natural_deduction_line_audit_v1
  instruction: |-
    Author a new task from scratch: natural_deduction_line_audit_v1.

    Cover exactly this, and put this line -- adapted to what you actually build -- in the class `summary`:

      Verify natural-deduction proofs line by line against introduction and elimination rules, tracking assumption scope and discharge; answers are the first unjustified line, a missing rule citation, or a final validity verdict.

    Every decision the summary does not fix is yours: instance family, generator, verifier, difficulty scaling, prompt wording and answer format. Other trials in this wave are implementing the same summary independently and are not coordinating with you. Make the choices you believe produce the best training data.

    AUTHORING_RULES.md lists the checks generate_entry must perform and the failure modes that sank earlier waves -- read it before writing code, and treat it as part of this instruction.
  owned_path: reasoning_core/tasks/generated/k3_formal_semantics_r2/natural_deduction_line_audit_v1
  validation:
  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/k3_formal_semantics_r2/natural_deduction_line_audit_v1
  design_choice: Present proofs as raw rule-application steps with no explicit line numbers, requiring
    the solver to infer which earlier lines each rule cites and flag the first step whose cited line numbers
    or rule name do not match the proof state.
