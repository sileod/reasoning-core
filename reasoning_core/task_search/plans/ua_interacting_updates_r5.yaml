  - PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --import-mode=importlib reasoning_core/tasks/generated/ua_interacting_updates_r5/substitution_uniform_recurrence_v1
  design_choice: Answer as a single token 'yes' or 'no' based on whether the recurrence function is bounded
    for all prefixes, with instances drawn from a fixed family of Pisot substitutions.
