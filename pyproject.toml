[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasoning_core"
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
description = "Procedural data generators for symbolic pre-training, also including RL environments"

dependencies = [
    "typing-extensions",
    "gramforge",
    "faker",
    "inflection",
    "rapidfuzz",
    "networkx",
    "z3-solver>=4.15.8",  # math_minimal_premises needs a fix first released in 4.15.8
    "requests",
    "easydict",
    "appdirs",
    "regex",
    "greenery",
    "tqdm",
    "pandas",
    "pyyaml",
    "tabulate",
    "duckdb",
    "funcy",
    "multiprocess",
    "exrex",
    "nltk",
    "numpy",
    "sympy",
    "pyparsing",
    "udocker",
    "wrapt",
    "psutil",
    "xxhash",
    "problog",
    "inflect",
    "babel",
]

[project.optional-dependencies]
# Generating new problems; the core list is what scoring needs (tests/integrations/test_rl_envs.py
# scores every pile task without these). tiktoken sets the exact max_tokens filter (without it
# lengths are counted in words, which changes which examples are kept); nfsdict backs the
# validation cache and collection; pgmpy, lark, wordfreq serve off-roster tasks; pooch is needed by
# gramforge's TPTP solver, which does not declare it. game_best_move and
# game_forced_win also need pyggp, which is git-only: pip install "pyggp @ git+https://github.com/Entze/pyggp"
gen = ["tiktoken", "nfsdict", "pgmpy", "lark", "wordfreq", "pooch"]
prime = ["prime", "verifiers"]
reasoning_gym = ["reasoning_gym"]
training = ["torch", "transformers", "datasets", "trl", "safetensors", "prodigyplus"]
eval = ["litlm"]
collection = ["huggingface-hub", "pyarrow"]

[tool.hatch.version]
path = "reasoning_core/__init__.py"

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "/reasoning_core/**/__pycache__",
    "/reasoning_core/**/.ipynb_checkpoints",
    "/reasoning_core/.mountpoints/**",
    "/reasoning_core/checkpoints/**",
    "/reasoning_core/generated_data/**",
    "/reasoning_core/index/**",
    "/integrations/**/.pytest_cache/**",
    "/integrations/**/.venv/**",
    "/reasoning_core/score_cache/**",
    "/reasoning_core/wandb/**",
]

[tool.hatch.build.targets.wheel]
packages = ["reasoning_core"]
exclude = ["/reasoning_core/task_search/**", "/reasoning_core/reports/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/GALLERY.md",
    "/LICENSE",
    "/README.md",
    "/TASK_AUTHORING_GUIDE.md",
    "/TASK_MUTATION_GUIDE.md",
    "/AGENTS.md",
    "/docs/workflows.md",
    "/docs/evaluation.md",
    "/docs/layout.md",
    "/docs/influence.md",
    "/docs/results",
    "/integrations",
    "/requirements",
    "/scripts",
    "/pyproject.toml",
    "/reasoning_core",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Patterns match a directory's *basename*, so a bare name here excludes that name anywhere in
# the tree. "integrations" used to be listed for the root integrations/ distributions and
# silently swallowed tests/integrations/ as well; it collected nothing either way. Prefer a
# path fragment over a bare name, and check `--collect-only` counts after adding one.
norecursedirs = [
    ".git",
    ".hypothesis",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".test",
    ".venv",
    "__pycache__",
    "checkpoints",
    "data-gym-cache",
    "per_task_results",
    "per_task_results_rgym",
    "reasoning_core/.mountpoints",
    "reasoning_core/generated_data",
    "reasoning_core/index",
    "reasoning_core/score_cache",
]
